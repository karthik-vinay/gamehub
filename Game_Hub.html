-shadow:0 5px 0 #228c89; }\n  button.pink { background:var(--pink); box-shadow:0 5px 0 #9e2e58; color:white; }\n  button:disabled { opacity:.5; cursor:default; transform:none; }\n  .cabinet { width:min(100%,1400px); border:4px solid var(--yellow); background:#161832; box-shadow:0 0 0 4px #161832,0 0 0 8px #4d3971,0 18px 50px #0009; padding:clamp(14px,2vw,30px); position:relative; }\n  .cabinet:before,.cabinet:after { content:'✦  ✦  ✦'; position:absolute; top:-29px; color:var(--pink); letter-spacing:13px; font-size:14px; left:12px; }\n  .cabinet:after { left:auto; right:12px; color:var(--cyan); }\n  header { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:14px; border-bottom:2px dashed #545a88; padding-bottom:12px; }\n  .brand { display:flex; align-items:center; gap:11px; }\n  .logo { width:48px; height:48px; display:grid; place-items:center; background:var(--pink); border:3px solid var(--cream); box-shadow:4px 4px 0 #801e59; color:white; font-size:26px; }\n  h1 { margin:0; font-size:clamp(25px,3.1vw,42px); letter-spacing:1.5px; line-height:1; text-shadow:3px 3px 0 #a82d68; }\n  .subtitle { font-size:clamp(10px,1vw,13px); letter-spacing:2px; color:var(--cyan); margin-top:7px; }\n  .highscore { color:var(--yellow); font-size:clamp(12px,1.1vw,15px); text-align:right; line-height:1.7; white-space:nowrap; }\n  .screen { display:none; }\n  .screen.active { display:block; }\n  .menuGrid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(290px,.8fr); gap:20px; }\n  .hero { background:#24284d; border:3px solid #6870a6; padding:clamp(20px,2.4vw,34px); position:relative; overflow:hidden; min-height:390px; }\n  .hero:after { content:'INSERT COIN'; position:absolute; bottom:15px; left:0; right:0; text-align:center; font-weight:900; letter-spacing:4px; color:var(--yellow); animation:blink 1.1s steps(2,start) infinite; }\n  @keyframes blink { to { visibility:hidden; } }\n  .gameTitle { font-weight:1000; font-size:clamp(42px,5.3vw,76px); line-height:.94; letter-spacing:-2px; color:var(--yellow); text-shadow:4px 4px 0 #de476f,8px 8px 0 #17172d; margin:12px 0 22px; }\n  .hero p { max-width:600px; color:#e4e7ff; line-height:1.65; font-size:clamp(15px,1.25vw,18px); }\n  .miniCourt { display:flex; gap:8px; align-items:center; margin:22px 0; color:var(--ink); font-weight:900; font-size:13px; }\n  .miniTeam { width:72px; height:38px; border:2px solid var(--cream); background:var(--pink); display:grid; place-items:center; color:white; }\n  .miniTeam.blue { background:var(--blue); }\n  .miniMid { flex:1; border-top:2px dashed #d9e3ab; text-align:center; color:var(--cream); }\n  .sidePanel { background:#1b1f3e; border:3px solid #424a7d; padding:clamp(16px,1.8vw,25px); display:flex; flex-direction:column; gap:14px; }\n  .panelLabel { color:var(--cyan); font-size:clamp(12px,1vw,15px); letter-spacing:2px; margin-bottom:2px; }\n  .sidePanel button { width:100%; text-align:left; font-size:clamp(14px,1.15vw,17px); padding:17px; }\n  .sidePanel button small { display:block; font-size:clamp(10px,.85vw,12px); opacity:.8; margin-top:5px; letter-spacing:1px; }\n  .helpText { color:var(--muted); font-size:12px; line-height:1.7; margin-top:auto; border-top:1px dashed #424a7d; padding-top:13px; }\n  .gameShell { border:3px solid #7478a6; background:#101328; padding:clamp(8px,1.1vw,14px); }\n  .gameTop { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; padding:5px 6px; flex-wrap:wrap; }\n  .hudTeam { display:flex; gap:9px; align-items:center; min-width:0; font-weight:900; font-size:clamp(13px,1.25vw,18px); }\n  .swatch { width:16px; height:16px; display:inline-block; border:2px solid var(--cream); flex:none; }\n  .hudCenter { text-align:center; color:var(--yellow); font-weight:900; font-size:clamp(15px,1.45vw,20px); white-space:nowrap; }\n  .smallButton { padding:10px 13px; font-size:clamp(11px,1vw,14px); box-shadow:0 3px 0 #a96a31; }\n  .canvasWrap { width:100%; position:relative; background:#0d1327; overflow:hidden; border:2px solid #101328; }\n  canvas { display:block; width:100%; height:auto; aspect-ratio:16/9; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; }\n  .gameBottom { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:clamp(11px,1vw,14px); padding:12px 4px 4px; flex-wrap:wrap; }\n  .modeTag { color:var(--cyan); }\n  .lobby { background:#22264a; border:3px solid #626ba0; padding:clamp(18px,3vw,34px); max-width:900px; margin:auto; }\n  .lobby h2 { margin:0 0 12px; color:var(--yellow); font-size:clamp(27px,3vw,38px); }\n  .lobby p { color:#d0d6f4; line-height:1.65; font-size:clamp(14px,1.2vw,17px); }\n  .difficultyGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:22px 0; }\n  .difficultyCard { min-height:112px; text-align:left; padding:20px; font-size:clamp(18px,2vw,25px); border:3px solid #fff1b8; line-height:1.3; }\n  .difficultyCard small { display:block; margin-top:8px; font-size:clamp(11px,1vw,14px); letter-spacing:1px; }\n  .difficultyCard.easy { background:#56e6d0; box-shadow:0 5px 0 #228c89; }\n  .difficultyCard.medium { background:#ffd84e; box-shadow:0 5px 0 #a96a31; }\n  .difficultyCard.hard { background:#ff9e56; box-shadow:0 5px 0 #a34b32; }\n  .difficultyCard.impossible { background:#ff5678; box-shadow:0 5px 0 #9e2e58; color:white; }\n  .difficultyCard.impossible small { color:#fff5c7; }\n  .lobbyActions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }\n  .joinRow { display:flex; gap:8px; margin-top:8px; }\n  input { width:100%; min-width:0; background:#101328; color:var(--cream); border:2px solid #777fb3; padding:12px; outline:none; text-transform:uppercase; }\n  input:focus { border-color:var(--cyan); }\n  .roomCode { font-size:clamp(18px,4vw,26px); color:var(--yellow); letter-spacing:2px; background:#11142a; padding:13px; border:2px dashed #737ba6; overflow-wrap:anywhere; user-select:all; margin:10px 0; }\n  .status { color:var(--cyan)!important; min-height:20px; }\n  .controlsGrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }\n  .controlCard { background:#22264a; border:2px solid #4d558a; padding:14px; }\n  .controlCard h3 { margin:0 0 12px; color:var(--yellow); font-size:16px; }\n  .keyRow { display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px dashed #434b78; padding:10px 0; color:#dfe3ff; font-size:14px; }\n  kbd { background:#0d1024; border:1px solid #737ba6; box-shadow:0 2px 0 #737ba6; padding:5px 8px; color:white; white-space:nowrap; font-family:inherit; font-size:12px; }\n  footer { text-align:center; color:#777fae; font-size:11px; letter-spacing:1.3px; margin-top:18px; }\n  .touchControls { display:none; gap:8px; justify-content:space-between; margin-top:10px; }\n  .touchControls button { padding:16px 12px; flex:1; touch-action:manipulation; font-size:clamp(12px,2vw,17px); }\n  .toast { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); background:#15162bee; border:3px solid var(--yellow); padding:12px 16px; z-index:5; text-align:center; display:none; width:max-content; max-width:90%; box-shadow:5px 5px 0 #0007; }\n  .toast.show { display:block; }\n  .hidden { display:none!important; }\n\n  .shopWallet { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#11142a; border:2px solid var(--yellow); padding:13px 16px; margin:16px 0; color:var(--cyan); font-weight:900; letter-spacing:1px; }\n  .shopWallet strong { font-size:clamp(23px,2.5vw,32px); color:var(--yellow); }\n  .shopGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:18px 0; }\n  .shopItem { display:flex; flex-direction:column; gap:10px; background:#171b38; border:2px solid #586198; padding:16px; min-width:0; }\n  .shopItem h3 { margin:0; font-size:clamp(16px,1.5vw,21px); color:var(--yellow); }\n  .shopItem p { margin:0; color:#d0d6f4; line-height:1.5; font-size:14px; flex:1; }\n  .shopItem .shopLevel { color:var(--cyan); font-size:12px; letter-spacing:1px; }\n  .shopItem button { width:100%; }\n  .shopNote { font-size:12px!important; color:var(--muted)!important; }\n  @media(max-width:600px){ .shopGrid{grid-template-columns:1fr;} }\n  @media(max-width:900px) { body{padding:9px;} .cabinet{padding:10px;border-width:3px;} .menuGrid{grid-template-columns:1fr;} .hero{min-height:235px;} .hero:after{bottom:10px;} .sidePanel{display:grid;grid-template-columns:1fr 1fr;} .panelLabel,.helpText{grid-column:1/-1;} .sidePanel button{font-size:clamp(14px,1.8vw,17px);padding:14px;} .highscore{display:none;} .controlsGrid{grid-template-columns:1fr;} header{gap:7px;} .logo{width:39px;height:39px;font-size:21px;} .subtitle{font-size:10px;} .touchControls{display:flex;} .gameTop{align-items:flex-start;} .gameBottom{font-size:11px;} .hudTeam{font-size:clamp(12px,1.65vw,15px);gap:6px;} .hudCenter{font-size:clamp(13px,1.7vw,16px);} }\n  @media(max-width:480px){ .sidePanel{grid-template-columns:1fr;} .difficultyGrid{grid-template-columns:1fr;} .hero{padding:12px;} .gameTitle{font-size:33px;} .lobbyActions{grid-template-columns:1fr;} .joinRow{flex-direction:column;} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"cabinet\">\n  \u003cheader>\n    \u003cdiv class=\"brand\">\u003cdiv class=\"logo\">◉\u003c/div>\u003cdiv>\u003ch1>DODGEBALL DUEL\u003c/h1>\u003cdiv class=\"subtitle\">RETRO PIXEL SPORTS • ARCADE EDITION\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"highscore\">COINS \u003cspan id=\"coinCount\">100\u003c/span>\u003cbr>HIGH SCORE \u003cspan id=\"highScore\">00000\u003c/span>\u003cbr>BEST TEAM: \u003cspan id=\"bestTeam\">RED ROCKETS\u003c/span>\u003c/div>\n  \u003c/header>\n\n  \u003csection id=\"menuScreen\" class=\"screen active\">\n    \u003cdiv class=\"menuGrid\">\n      \u003cdiv class=\"hero\">\n        \u003cdiv style=\"color:var(--cyan);font-size:11px;letter-spacing:3px\">ARCADE SPORTS LEAGUE PRESENTS\u003c/div>\n        \u003cdiv class=\"gameTitle\">DODGE.\u003cbr>THROW.\u003cbr>DOMINATE.\u003c/div>\n        \u003cdiv class=\"miniCourt\">\u003cdiv class=\"miniTeam\">RED\u003c/div>\u003cdiv class=\"miniMid\">VS\u003c/div>\u003cdiv class=\"miniTeam blue\">BLUE\u003c/div>\u003c/div>\n        \u003cp>Grab the ball, line up your shot, and send your rival packing. Retro arcade action with ricochets, clutch catches, quick dodges, and bragging rights.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"sidePanel\">\n        \u003cdiv class=\"panelLabel\">CHOOSE YOUR GAME\u003c/div>\n        \u003cbutton id=\"fightCpu\" class=\"pink\">ARCADE MODE \u003csmall>ONE PLAYER VS CPU\u003c/small>\u003c/button>\n        \u003cbutton id=\"localMode\" class=\"cyan\">LOCAL VERSUS \u003csmall>2 PLAYERS • ONE DEVICE\u003c/small>\u003c/button>\n        \u003cbutton id=\"shopBtn\" class=\"secondary\">ARCADE SHOP \u003csmall>UPGRADES • SPEND YOUR COINS\u003c/small>\u003c/button>\n        \u003cbutton id=\"adminBtn\" class=\"secondary\">ADMIN PANEL \u003csmall>ENTER A CODE\u003c/small>\u003c/button>\n        \u003cbutton id=\"onlineMode\" class=\"secondary\">ONLINE DUEL \u003csmall>ROOM CODE • TWO DEVICES\u003c/small>\u003c/button>\n        \u003cbutton id=\"controlsBtn\" class=\"secondary\">HOW TO PLAY \u003csmall>CONTROLS & RULES\u003c/small>\u003c/button>\n        \u003cdiv class=\"helpText\">BEST PLAYED WITH A KEYBOARD.\u003cbr>FIRST TO 3 ROUNDS WINS THE MATCH.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"difficultyScreen\" class=\"screen\">\n    \u003cdiv class=\"lobby difficultyLobby\">\n      \u003ch2>CHOOSE YOUR CHALLENGE\u003c/h2>\n      \u003cp>Pick the CPU difficulty. The opponent gets faster, smarter, and more accurate at higher levels.\u003c/p>\n      \u003cdiv class=\"difficultyGrid\">\n        \u003cbutton class=\"difficultyCard easy\" data-difficulty=\"easy\">EASY\u003csmall>RELAXED RALLIES\u003c/small>\u003c/button>\n        \u003cbutton class=\"difficultyCard medium\" data-difficulty=\"medium\">MEDIUM\u003csmall>A FAIR FIGHT\u003c/small>\u003c/button>\n        \u003cbutton class=\"difficultyCard hard\" data-difficulty=\"hard\">HARD\u003csmall>QUICK REACTIONS\u003c/small>\u003c/button>\n        \u003cbutton class=\"difficultyCard impossible\" data-difficulty=\"impossible\">IMPOSSIBLE\u003csmall>THE CHALLENGER: JADEN\u003c/small>\u003c/button>\n      \u003c/div>\n      \u003cbutton id=\"difficultyBack\" class=\"secondary\">BACK TO MENU\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"adminScreen\" class=\"screen\">\n    \u003cdiv class=\"lobby adminLobby\">\n      \u003ch2>ADMIN PANEL\u003c/h2>\n      \u003cp>Enter a code and press REDEEM. Codes apply to your player in Arcade mode.\u003c/p>\n      \u003cdiv class=\"joinRow\">\u003cinput id=\"adminCode\" type=\"text\" maxlength=\"24\" placeholder=\"ENTER CODE\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\">\u003cbutton id=\"adminRedeem\" class=\"pink\">REDEEM\u003c/button>\u003c/div>\n      \u003cp id=\"adminStatus\" class=\"status\">\u003c/p>\n      \u003cdiv class=\"shopWallet\">\u003cspan>YOUR COINS\u003c/span>\u003cstrong id=\"adminCoins\">0\u003c/strong>\u003c/div>\n      \u003cdiv class=\"shopWallet\">\u003cspan>STARTING BALLS\u003c/span>\u003cstrong id=\"adminBalls\">10\u003c/strong>\u003c/div>\n      \u003cbutton id=\"adminBack\" class=\"secondary\">BACK TO MENU\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"shopScreen\" class=\"screen\">\n    \u003cdiv class=\"lobby shopLobby\">\n      \u003ch2>ARCADE SHOP\u003c/h2>\n      \u003cp>Spend coins earned in Arcade matches on upgrades. Every purchase has a real gameplay effect. Upgrades apply to your player in Arcade mode only, so local and online duels stay fair.\u003c/p>\n      \u003cdiv class=\"shopWallet\">\u003cspan>YOUR COINS\u003c/span>\u003cstrong id=\"shopCoins\">100\u003c/strong>\u003c/div>\n      \u003cdiv id=\"shopItems\" class=\"shopGrid\">\u003c/div>\n      \u003cbutton id=\"shopBack\" class=\"secondary\">BACK TO MENU\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"onlineScreen\" class=\"screen\">\n    \u003cdiv class=\"lobby\">\n      \u003ch2>ONLINE DUEL\u003c/h2>\n      \u003cp>Host a private room and send the room code to a friend, or join their room. Both players need internet access. Peer-to-peer connection uses the PeerJS signaling service.\u003c/p>\n      \u003cdiv class=\"lobbyActions\">\u003cbutton id=\"hostBtn\" class=\"cyan\">HOST A ROOM\u003c/button>\u003cbutton id=\"backOnlineBtn\" class=\"secondary\">BACK TO MENU\u003c/button>\u003c/div>\n      \u003cdiv id=\"hostRoomArea\" class=\"hidden\">\n        \u003cdiv class=\"panelLabel\">YOUR ROOM CODE — SHARE THIS\u003c/div>\u003cdiv id=\"roomCodeDisplay\" class=\"roomCode\">CONNECTING…\u003c/div>\n        \u003cbutton id=\"copyCodeBtn\" class=\"secondary\">COPY ROOM CODE\u003c/button>\n      \u003c/div>\n      \u003cdiv style=\"border-top:1px dashed #555d8f;margin-top:16px;padding-top:15px\">\n        \u003cdiv class=\"panelLabel\">JOIN A FRIEND\u003c/div>\n        \u003cdiv class=\"joinRow\">\u003cinput id=\"joinCode\" placeholder=\"ENTER ROOM CODE\" maxlength=\"40\" autocomplete=\"off\">\u003cbutton id=\"joinBtn\">JOIN ROOM\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cp id=\"onlineStatus\" class=\"status\">Choose host or enter a room code.\u003c/p>\n      \u003cp style=\"font-size:10px;color:#aeb4d4\">If the signaling service is unavailable on your network, online play may fail. Local and CPU modes work without networking.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"controlsScreen\" class=\"screen\">\n    \u003cdiv class=\"lobby\">\n      \u003ch2>HOW TO PLAY\u003c/h2>\u003cp>Two sides, two balls, three lives. Grab a ball, face your rival, and throw! Land three hits to win the round. First to three rounds wins the match.\u003c/p>\n      \u003cdiv class=\"controlsGrid\">\n        \u003cdiv class=\"controlCard\">\u003ch3>ARCADE / ONLINE PLAYER\u003c/h3>\n          \u003cdiv class=\"keyRow\">\u003cspan>Move / face\u003c/span>\u003ckbd>W A S D\u003c/kbd>\u003c/div>\n          \u003cdiv class=\"keyRow\">\u003cspan>Pick up / throw\u003c/span>\u003ckbd>E / CLICK\u003c/kbd>\u003c/div>\n          \u003cdiv class=\"keyRow\">\u003cspan>Quick dodge\u003c/span>\u003ckbd>SPACE\u003c/kbd>\u003c/div>\n          \u003cdiv class=\"keyRow\">\u003cspan>Catch attempt\u003c/span>\u003ckbd>Q\u003c/kbd>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"controlCard\">\u003ch3>LOCAL PLAYER 2\u003c/h3>\n          \u003cdiv class=\"keyRow\">\u003cspan>Move / face\u003c/span>\u003ckbd>ARROWS\u003c/kbd>\u003c/div>\n          \u003cdiv class=\"keyRow\">\u003cspan>Pick up / throw\u003c/span>\u003ckbd>ENTER\u003c/kbd>\u003c/div>\n          \u003cdiv class=\"keyRow\">\u003cspan>Quick dodge\u003c/span>\u003ckbd>RIGHT SHIFT\u003c/kbd>\u003c/div>\n          \u003cdiv class=\"keyRow\">\u003cspan>Catch attempt\u003c/span>\u003ckbd>RIGHT CTRL\u003c/kbd>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:16px\">\u003cbutton id=\"controlsBack\" class=\"secondary\">BACK\u003c/button>\u003cbutton id=\"startFromControls\">LET'S PLAY\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"gameScreen\" class=\"screen\">\n    \u003cdiv class=\"gameShell\">\n      \u003cdiv class=\"gameTop\">\n        \u003cdiv class=\"hudTeam\">\u003cspan class=\"swatch\" style=\"background:var(--pink)\">\u003c/span>\u003cspan id=\"leftLabel\">RED ROCKETS\u003c/span>\u003cspan id=\"leftLives\">♥ ♥ ♥\u003c/span>\u003c/div>\n        \u003cdiv class=\"hudCenter\">\u003cspan id=\"roundLabel\">ROUND 1\u003c/span> \u003cspan id=\"timerLabel\">00:45\u003c/span>\u003c/div>\n        \u003cdiv class=\"hudTeam\" style=\"justify-content:flex-end\">\u003cspan id=\"rightLives\">♥ ♥ ♥\u003c/span>\u003cspan id=\"rightLabel\">BLUE BOLTS\u003c/span>\u003cspan class=\"swatch\" style=\"background:var(--blue)\">\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"canvasWrap\">\u003ccanvas id=\"gameCanvas\" width=\"480\" height=\"270\" aria-label=\"Dodgeball playing field\">\u003c/canvas>\u003cdiv id=\"toast\" class=\"toast\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"gameBottom\">\u003cspan id=\"modeTag\" class=\"modeTag\">ARCADE MODE\u003c/span>\u003cspan>THROW: E / CLICK / ENTER &nbsp; • &nbsp; DODGE: SPACE / SHIFT &nbsp; • &nbsp; PAUSE: ESC\u003c/span>\u003cbutton id=\"pauseBtn\" class=\"smallButton secondary\">PAUSE\u003c/button>\u003cbutton id=\"restartBtn\" class=\"smallButton\">RESTART\u003c/button>\u003cbutton id=\"menuBtn\" class=\"smallButton secondary\">MENU\u003c/button>\u003c/div>\n      \u003cdiv class=\"touchControls\" id=\"touchControls\">\u003cbutton id=\"touchUp\" class=\"secondary\">▲\u003c/button>\u003cbutton id=\"touchLeft\" class=\"secondary\">◀\u003c/button>\u003cbutton id=\"touchAction\">PICK UP / THROW\u003c/button>\u003cbutton id=\"touchRight\" class=\"secondary\">▶\u003c/button>\u003cbutton id=\"touchDown\" class=\"secondary\">▼\u003c/button>\u003cbutton id=\"touchDodge\" class=\"pink\">DODGE\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003cfooter>DODGEBALL DUEL • RUN IT BACK!\u003c/footer>\n\u003c/div>\n\u003cscript>\n(() => {\n'use strict';\nconst $ = id => document.getElementById(id);\nconst canvas = $('gameCanvas');\nconst ctx = canvas.getContext('2d');\nctx.imageSmoothingEnabled = false;\nconst W = canvas.width, H = canvas.height;\nconst COLORS = {ink:'#15162b', navy:'#202648', cream:'#fff1b8', yellow:'#ffd84e', pink:'#ff5678', cyan:'#56e6d0', blue:'#57a8ff', court:'#267d70', court2:'#227368', line:'#f8e7a2', dark:'#101328', skin:'#ffc18b', skin2:'#b96d51', hair:'#382844'};\nconst screens = ['menuScreen','difficultyScreen','shopScreen','adminScreen','onlineScreen','controlsScreen','gameScreen'];\nlet mode = 'cpu', state = 'menu', paused = false, gameOver = false, roundOver = false, roundEndTimer = 0;\nlet cpuDifficulty = 'medium';\nlet players = [], balls = [], round = 1, clock = 45, roundTimer = 0, roundScores = [0,0], lastTime = 0, accumulator = 0;\nlet keys = new Set(), pressed = new Set(), pointer = {x:240,y:135,inside:false};\nlet particles = [], floatingTexts = [], remoteInput = emptyInput(), peer = null, conn = null, netRole = '', netConnected = false, netPeerId = '', remoteSnapshot = null, lastSend = 0, lastInputSend = 0, netError = '';\nlet toastTimer = 0, highScore = Number(localStorage.getItem('dodgeballduel-highscore') || 0);\nconst SHOP_ITEMS = [\n  {id:'powerThrow',name:'CANNON ARM',icon:'➤',description:'Throw balls 14% faster per level in Arcade mode.',costs:[150,225,325]},\n  {id:'turboSneakers',name:'TURBO SNEAKERS',icon:'»',description:'Move 8% faster per level in Arcade mode.',costs:[140,210,300]},\n  {id:'quickDodge',name:'QUICK REFLEXES',icon:'⚡',description:'Reduce dodge cooldown by 12% per level in Arcade mode.',costs:[160,240,350]},\n  {id:'catchGloves',name:'STICKY GLOVES',icon:'✦',description:'Catch timing lasts 0.06 seconds longer per level in Arcade mode.',costs:[125,190,275]}\n];\nfunction readStoredNumber(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:Number(v)||0;}catch{return fallback;}}\nfunction readStoredLevels(){try{const v=JSON.parse(localStorage.getItem('dodgeballduel-upgrades')||'{}');return {powerThrow:Math.min(3,Math.max(0,Number(v.powerThrow)||0)),turboSneakers:Math.min(3,Math.max(0,Number(v.turboSneakers)||0)),quickDodge:Math.min(3,Math.max(0,Number(v.quickDodge)||0)),catchGloves:Math.min(3,Math.max(0,Number(v.catchGloves)||0))};}catch{return {powerThrow:0,turboSneakers:0,quickDodge:0,catchGloves:0};}}\nlet coins=readStoredNumber('dodgeballduel-coins',100), shopLevels=readStoredLevels();\ntry{if(localStorage.getItem('dodgeballduel-coins')===null)localStorage.setItem('dodgeballduel-coins','100');}catch{}\n$('highScore').textContent = String(highScore).padStart(5,'0');\nfunction saveProgress(){try{localStorage.setItem('dodgeballduel-coins',String(coins));localStorage.setItem('dodgeballduel-upgrades',JSON.stringify(shopLevels));}catch{}}\nfunction updateCoinLabels(){const a=$('coinCount');if(a)a.textContent=String(coins);const b=$('shopCoins');if(b)b.textContent=String(coins);}\nfunction renderShop(){updateCoinLabels();$('shopItems').innerHTML=SHOP_ITEMS.map(item=>{const level=shopLevels[item.id]||0,done=level>=3,cost=item.costs[level]||0;return `\u003carticle class=\"shopItem\">\u003ch3>${item.icon} ${item.name}\u003c/h3>\u003cp>${item.description}\u003c/p>\u003cdiv class=\"shopLevel\">LEVEL ${level}/3 ${done?'• MAXED':''}\u003c/div>\u003cbutton data-buy=\"${item.id}\" ${done||coins\u003ccost?'disabled':''}>${done?'MAX LEVEL':`BUY • ${cost} COINS`}\u003c/button>\u003c/article>`;}).join('');}\nfunction awardCoins(amount,reason='BONUS'){if(amount\u003c=0)return;coins+=amount;saveProgress();updateCoinLabels();floatText(240,66,'+'+amount+' COINS',COLORS.yellow);setToast('+'+amount+' COINS • '+reason,1.25);}\n\nfunction emptyInput(){ return {x:0,y:0,action:false,dodge:false,catch:false,aimX:0,aimY:0,aimValid:false}; }\nfunction showScreen(id){ screens.forEach(s => $(s).classList.toggle('active',s===id)); }\nfunction setToast(text, duration=1.2){ $('toast').textContent=text; $('toast').classList.add('show'); toastTimer=duration; }\nfunction setOnlineStatus(text){ $('onlineStatus').textContent=text; }\nfunction keyName(e){ return e.code==='Space'?'space':e.key.toLowerCase(); }\nconst preventKeys = new Set(['space','arrowup','arrowdown','arrowleft','arrowright','enter','shift','control']);\nwindow.addEventListener('keydown', e => { const k=keyName(e); if(preventKeys.has(k)) e.preventDefault(); if(!keys.has(k)) pressed.add(k); keys.add(k); if(k==='escape' && state==='game') { paused=!paused; $('pauseBtn').textContent=paused?'RESUME':'PAUSE'; } });\nwindow.addEventListener('keyup', e => keys.delete(keyName(e)));\nwindow.addEventListener('blur',()=>{ keys.clear(); pressed.clear(); });\ncanvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(); pointer.x=(e.clientX-r.left)/r.width*W; pointer.y=(e.clientY-r.top)/r.height*H; pointer.inside=true;});\ncanvas.addEventListener('pointerleave',()=>pointer.inside=false);\ncanvas.addEventListener('pointerdown',e=>{ if(e.button===0 && state==='game' && mode!=='local' && players[0]) { e.preventDefault(); pressed.add('e'); } });\nfunction hitButton(id,fn){ $(id).addEventListener('click',fn); }\nhitButton('fightCpu',()=>{showScreen('difficultyScreen');state='difficultyMenu';});\nhitButton('difficultyBack',()=>{showScreen('menuScreen');state='menu';});\ndocument.querySelectorAll('[data-difficulty]').forEach(btn=>btn.addEventListener('click',()=>startGame('cpu',btn.dataset.difficulty)));\nhitButton('localMode',()=>startGame('local'));\nfunction updateAdminLabels(){const c=$('adminCoins');if(c)c.textContent=String(coins);const b=$('adminBalls');if(b)b.textContent=String(bonusBalls?BONUS_BALLS:START_BALLS);}\nfunction redeemCode(){const input=$('adminCode'),code=input.value.trim().toLowerCase(),out=$('adminStatus');input.value='';\n  if(code==='ty4playing'){coins+=500;saveProgress();updateCoinLabels();out.textContent='CODE ACCEPTED: +500 COINS!';}\n  else if(code==='nahidwin'){bonusBalls=!bonusBalls;try{localStorage.setItem('dodgeballduel-bonusballs',bonusBalls?'1':'0');}catch{}out.textContent=bonusBalls?'CODE ACCEPTED: YOU NOW START WITH 20 BALLS!':'CODE TOGGLED OFF: BACK TO 10 STARTING BALLS.';}\n  else out.textContent=code?'INVALID CODE.':'ENTER A CODE FIRST.';\n  updateAdminLabels();}\nhitButton('adminBtn',()=>{$('adminStatus').textContent='';updateAdminLabels();state='admin';showScreen('adminScreen');});\nhitButton('adminBack',()=>{state='menu';showScreen('menuScreen');});\nhitButton('adminRedeem',redeemCode);\n$('adminCode').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')redeemCode();});\n$('adminCode').addEventListener('keyup',e=>e.stopPropagation());\nhitButton('shopBtn',()=>{renderShop();state='shop';showScreen('shopScreen');});\nhitButton('shopBack',()=>{state='menu';showScreen('menuScreen');});\n$('shopItems').addEventListener('click',e=>{const btn=e.target.closest('[data-buy]');if(!btn)return;const item=SHOP_ITEMS.find(x=>x.id===btn.dataset.buy);if(!item)return;const level=shopLevels[item.id]||0;if(level>=3)return;const cost=item.costs[level];if(coins\u003ccost){setToast('NOT ENOUGH COINS!',1);return;}coins-=cost;shopLevels[item.id]=level+1;saveProgress();renderShop();setToast(item.name+' UPGRADED!',1.2);});\nhitButton('onlineMode',()=>{closeNet();showScreen('onlineScreen');state='onlineMenu';setOnlineStatus('Choose host or enter a room code.');$('hostRoomArea').classList.add('hidden');});\nhitButton('controlsBtn',()=>showScreen('controlsScreen'));\nhitButton('controlsBack',()=>showScreen('menuScreen'));\nhitButton('startFromControls',()=>startGame('cpu','medium'));\nhitButton('backOnlineBtn',()=>{closeNet();state='menu';showScreen('menuScreen');});\nhitButton('restartBtn',()=>{ if(mode==='online'){ if(netRole==='host'){startMatch();syncSnapshot(true);} else if(conn&&conn.open) conn.send({type:'restart'}); } else startMatch(); });\nhitButton('menuBtn',()=>{closeNet();state='menu';paused=false;showScreen('menuScreen');});\nhitButton('pauseBtn',()=>{paused=!paused;$('pauseBtn').textContent=paused?'RESUME':'PAUSE';});\nhitButton('hostBtn',hostOnline);\nhitButton('joinBtn',joinOnline);\nhitButton('copyCodeBtn',async()=>{try{await navigator.clipboard.writeText($('roomCodeDisplay').textContent);setOnlineStatus('Room code copied. Send it to your friend.');}catch{setOnlineStatus('Select and copy the room code manually.');}});\n\nfunction createPlayer(id){ return {id,x:id===0?85:395,y:135,vx:0,vy:0,r:7,faceX:id===0?1:-1,faceY:0,lives:3,roundScore:0,heldBall:null,stock:0,dash:0,dashCooldown:0,invuln:0,catchWindow:0,throwCooldown:0,throwWindup:0,throwAnim:0,throwDX:id===0?1:-1,throwDY:0,hitFlash:0,stun:0,anim:0,prevX:0,prevY:0,aiThink:0,aiAction:emptyInput(),score:0,aiMoveX:0,aiMoveY:0}; }\nlet nextBallId=0;\nfunction newBall(x,y){return {id:nextBallId++,x,y,vx:0,vy:0,heldBy:-1,flying:false,age:0,bounces:0,trail:[],spin:0,lastOwner:-1};}\nconst START_BALLS=10, BONUS_BALLS=20;\nlet bonusBalls=false;try{bonusBalls=localStorage.getItem('dodgeballduel-bonusballs')==='1';}catch{}\nfunction startBallsFor(p){return(mode==='cpu'&&p.id===0&&bonusBalls)?BONUS_BALLS:START_BALLS;}\nfunction spawnBalls(){ balls=[]; [{x:225,y:112},{x:255,y:158}].forEach(p=>balls.push(newBall(p.x,p.y)));\n  // Every player starts the round carrying 10 balls: one in hand, the rest in reserve (auto-reload after each throw).\n  players.forEach(p=>{const b=newBall(p.x,p.y);b.heldBy=p.id;p.heldBall=b;p.stock=startBallsFor(p)-1;balls.push(b);}); }\nfunction startGame(nextMode,difficulty=cpuDifficulty){ if(nextMode!=='online') closeNet(); mode=nextMode; if(mode==='cpu')cpuDifficulty=['easy','medium','hard','impossible'].includes(difficulty)?difficulty:'medium'; state='game'; paused=false; gameOver=false; roundOver=false; roundScores=[0,0]; round=1; initMatch(); showScreen('gameScreen'); $('pauseBtn').textContent='PAUSE'; $('modeTag').textContent=mode==='cpu'?'ARCADE • '+cpuDifficulty.toUpperCase():mode==='local'?'LOCAL 1V1':'ONLINE 1V1'; $('leftLabel').textContent=mode==='cpu'?'YOU':'RED ROCKETS'; $('rightLabel').textContent=mode==='cpu'?(cpuDifficulty==='impossible'?'JADEN':'CPU RIVAL'):'BLUE BOLTS'; }\nfunction initMatch(){ players=[createPlayer(0),createPlayer(1)]; clock=45; roundTimer=0; roundOver=false; gameOver=false; roundEndTimer=0; paused=false; particles=[]; floatingTexts=[]; spawnBalls(); updateHud(); setToast('GET READY!',1); if(mode==='online'&&netRole==='host')syncSnapshot(true); }\nfunction startMatch(){ initMatch(); }\nfunction startRound(){ round+ acc=11*(1-Math.pow(c.v/95,1.6));\n  c.v+=clamp(vt-c.v,-52*dt,Math.max(0,acc)*dt);\n  c.d+=clamp(c.tl-c.d,-3.2*dt,3.2*dt);\n  c.phi=clamp((c.tl-c.d)*.06,-.12,.12);\n  c.dist+=c.v*dt;\n  c.steerVis=-clamp(Q.k*60,-.4,.4);\n}\nfunction step(dt){\n  time+=dt;\n  if(state==='countdown'){\n    cdPrev=cd;cd+=dt;\n    for(let i=1;i\u003c=5;i++)if(cdPrev\u003ci&&cd>=i){setLights(i);beep(440,.15)}\n    if(cd>=6.2){state='race';setLights(0);beep(880,.5,.1);say('GO! GO! GO!','#4ade80')}\n  }\n  const racing=state==='race',fin=state==='finish';\n  if(racing||fin){\n    stepPlayer(dt,racing);\n    for(const c of cars)if(c!==pl)stepAI(c,dt);\n    for(const o of cars){\n      if(o===pl)continue;\n      const dds=wrapd(o.dist-pl.dist);\n      if(racing&&Math.abs(dds)\u003c4.9&&Math.abs(o.d-pl.d)\u003c1.9){\n        const dir=pl.d>=o.d?1:-1;pl.d+=dir*3*dt;o.d-=dir*1.5*dt;\n        if(dds>0)pl.v=Math.min(pl.v,o.v*.96);else o.v=Math.min(o.v,pl.v*.96);\n        shake=Math.max(shake,.35);emitSparks(pl,3);\n        if(drifting)endDrift(false);\n      }\n    }\n  }\n  for(const c of cars)pose(c);\n  const sorted=cars.slice().sort((a,b)=>b.dist-a.dist);rank=sorted.indexOf(pl)+1;\n  if(racing&&rank\u003cprevRank)say('OVERTAKE!  P'+rank,'#4ade80');\n  prevRank=rank;\n  if(racing){\n    raceT+=dt;\n    const ln=Math.floor(pl.dist/L);\n    if(ln>lapIdx){\n      lapIdx=ln;\n      if(ln===0)lapStart=raceT;\n      else{const t=raceT-lapStart;const oldBest=bestLapForTrack(TI);if(oldBest==null||t\u003coldBest){best=t;trackBestLaps[TI]=t;saveBestLaps();if(oldBest!=null){coins+=10;saveGarage();say('NEW BEST LAP!  +10 COINS','#4ade80')}else{say('FIRST BEST LAP!','#fde047')}}else if(best==null||t\u003cbest)best=t;lapStart=raceT;say(ln\u003cLAPS?(ln===LAPS-1?'FINAL LAP!  '+fmt(t):'LAP '+ln+'  '+fmt(t)):'FINISH!','#fde047')}\n      if(ln>=LAPS){\n        state='finish';finT=0;finRank=rank;finTime=raceT;\n        const beaten=Math.max(0,GRIDN-rank);const payout=[1,5,8,12,15,20][TI]||1;const earned=beaten*payout;coins+=earned;saveGarage();\n        endDrift(false);beep(660,.2,.08);setTimeout(()=>beep(880,.4,.08),220);\n      }\n    }\n  }\n  if(state==='finish'){finT+=dt;if(finT>3.5&&!finShown)showEnd()}\n  shake=Math.max(0,shake-dt*1.5);\n}\n\n/* ================= RENDER SYNC ================= */\nfunction sync(dt){\n  const pitchT=clamp(-lastA*.0025,-.03,.03);\n  for(const c of cars){\n    const m=c.m,r=m.root;\n    const dx=c.x-camera.position.x,dz=c.z-camera.position.z;\n    r.visible=(dx*dx+dz*dz)\u003c700*700;\n    if(!r.visible)continue;\n    r.position.set(c.x,.13,c.z);r.rotation.y=c.yaw-c.slip;\n    if(c===pl){\n      c.pitch+=(pitchT-c.pitch)*Math.min(1,dt*6);\n      const rt=-(c.sv*.02*(c.v/90))-(drifting?driftDir*.04:0);\n      c.roll+=(rt-c.roll)*Math.min(1,dt*6);\n    }\n    m.tilt.rotation.x=c.pitch;m.tilt.rotation.z=c.roll;\n    for(const w of m.wheels){w.spin.rotation.x+=c.v/.36*dt;if(w.steer)w.steer.rotation.y=c.steerVis}\n    if(c===pl){m.brake.emissiveIntensity=brakeOn?4:.6;const fl=boosting||kickT>0;m.flame.visible=fl;if(fl)m.flame.scale.set(1,1,.7+Math.random()*.6)}\n    else m.brake.emissiveIntensity=.6;\n  }\n}\nfunction updateCamera(dt){\n  let a=pl.yaw;\n  if(state==='menu'){\n    const ang=time*.22+.6,r=9;\n    camera.position.set(pl.x+Math.sin(ang)*r,2.4,pl.z+Math.cos(ang)*r);\n    camera.fov=48;camera.updateProjectionMatrix();camera.lookAt(pl.x,.7,pl.z);camYaw=NaN;return;\n  }\n  if(Number.isNaN(camYaw))camYaw=a;\n  let df=a-camYaw;while(df>Math.PI)df-=TAU;while(df\u003c-Math.PI)df+=TAU;\n  camYaw+=df*(1-Math.exp(-5*dt));\n  const fx=Math.sin(camYaw),fz=Math.cos(camYaw),sp=pl.v/92;\n  const back=7.4+sp*.9,h=2.35+sp*.25;\n  const sh=shake*.35;\n  camera.position.set(pl.x-fx*back+(Math.random()-.5)*sh,h+(Math.random()-.5)*sh,pl.z-fz*back+(Math.random()-.5)*sh);\n  const fov=62+sp*13+((boosting||kickT>0)?6:0)+(drifting?2:0);\n  if(Math.abs(camera.fov-fov)>.05){camera.fov+=(fov-camera.fov)*Math.min(1,dt*5);camera.updateProjectionMatrix()}\n  camera.lookAt(pl.x+fx*14,.95,pl.z+fz*14);\n}\n\n/* ================= UI ================= */\nconst menu=$('menu'),end=$('end'),hud=$('hud');\nfunction thumb(cv,td,col){\n  const g=cv.getContext('2d'),w=cv.width,h=cv.height,pad=12;\n  const s=Math.min((w-pad*2)/(td.maxX-td.minX),(h-pad*2)/(td.maxZ-td.minZ));\n  const ox=(w-(td.maxX-td.minX)*s)/2,oz=(h-(td.maxZ-td.minZ)*s)/2;\n  const X=p=>ox+(p.x-td.minX)*s,Z=p=>oz+(p.z-td.minZ)*s;\n  g.lineJoin='round';g.lineCap='round';g.beginPath();\n  for(let i=0;i\u003c=td.N;i+=3){const p=td.P[i%td.N];i?g.lineTo(X(p),Z(p)):g.moveTo(X(p),Z(p))}\n  g.closePath();g.strokeStyle='#0b0f1a';g.lineWidth=8;g.stroke();g.strokeStyle=col;g.lineWidth=4;g.stroke();\n  g.fillStyle='#fff';g.beginPath();g.arc(X(td.P[0]),Z(td.P[0]),4,0,TAU);g.fill();\n}\n(function buildCards(){\n  const box=$('cards');\n  TR.forEach((t,i)=>{\n    const td=TD[i],d=document.createElement('div');\n    d.className='card';d.style.setProperty('--c',t.col);\n    d.innerHTML='\u003cspan class=\"tag\">'+t.tag+'\u003c/span>\u003ch3>'+t.name+'\u003c/h3>\u003ccanvas width=\"440\" height=\"150\">\u003c/canvas>'+\n      '\u003cdiv class=\"st\">\u003cspan>Corners\u003c/span>\u003cb>'+td.turns+'\u003c/b>\u003c/div>'+\n      '\u003cdiv class=\"st\">\u003cspan>Lap length\u003c/span>\u003cb>'+(td.L/1000).toFixed(2)+' km\u003c/b>\u003c/div>'+\n      '\u003cdiv class=\"st\">\u003cspan>Rivals\u003c/span>\u003cb style=\"color:'+t.col+'\">'+'&#9733;'.repeat(t.stars)+'\u003cspan style=\"color:#444\">'+'&#9733;'.repeat(5-t.stars)+'\u003c/span>\u003c/b>\u003c/div>'+\n      '\u003cdiv class=\"st\">\u003cspan>Start\u003c/span>\u003cb>P'+(t.slot+1)+' / 20\u003c/b>\u003c/div>';\n    thumb(d.querySelector('canvas'),td,t.col);\n    d.onclick=()=>{audioInit();if(ac&&ac.state==='suspended')ac.resume();menu.classList.add('hide');begin(i)};\n    box.appendChild(d);\n  });\n})();\nupdateCoins();drawWheel();\nfunction showEnd(){\n  finShown=true;end.classList.remove('hide');\n  const r=finRank;\n  $('eT').innerHTML=r===1?'YOU \u003cb>WIN!\u003c/b>':r\u003c=3?'PODIUM! \u003cb>'+ord(r)+'\u003c/b>':'FINISHED \u003cb>'+ord(r)+'\u003c/b>';\n  $('eS').innerHTML=CFG.tag+' &bull; '+CFG.name+'\u003cbr>Race time: '+fmt(finTime)+'\u003cbr>Best lap: '+fmt(best)+'\u003cbr>\u003cb style=\"color:#ffd34d\">+ '+((GRIDN-finRank)*([1,5,8,12,15,20][TI]||1))+' coins\u003c/b> &nbsp; • &nbsp; \u003cb style=\"color:#ffd34d\">Total: '+coins+'\u003c/b>\u003cbr>'+\n    (r===1?(TI\u003cTR.length-1?'Champion! Ready for a harder track?':'You conquered the hardest track. Legend!'):r\u003c=3?'Awesome driving!':'Good fight! Drift through corners for turbo boosts and watch your tyre wear.');\n  $('next').style.display=(r\u003c=3&&TI\u003cTR.length-1)?'inline-block':'none';renderGarage();\n}\nfunction begin(i){\n  if(i!==TI)loadTrack(i);\n  resetRace();state='countdown';hud.classList.remove('hide');updateCoins();\n  for(const c of cars)pose(c);beep(300,.1);\n}\n$('shopBtn').onclick=()=>{$('shop').classList.remove('hide');$('menu').classList.add('hide');updateCoins()};\n$('closeShop').onclick=()=>{$('shop').classList.add('hide');$('menu').classList.remove('hide');updateCoins()};\n$('garageBtn').onclick=()=>{garageBrowseIndex=0;$('garage').classList.remove('hide');$('menu').classList.add('hide');renderGarage();updateCoins()};\n$('endGarage').onclick=()=>{garageBrowseIndex=0;$('end').classList.add('hide');$('garage').classList.remove('hide');renderGarage();updateCoins()};\n$('garagePrev').onclick=()=>{if(garageBrowseIndex>0){garageBrowseIndex--;renderGarage('prev')}};\n$('garageNext').onclick=()=>{const n=garageCars().length;if(garageBrowseIndex\u003cn-1){garageBrowseIndex++;renderGarage('next')}};\n$('closeGarage').onclick=()=>{\n  $('garage').classList.add('hide');\n  $('end').classList.add('hide');\n  $('shop').classList.add('hide');\n  $('hud').classList.add('hide');\n  resetRace();\n  for(const c of cars)pose(c);\n  state='menu';\n  menu.classList.remove('hide');\n  updateCoins();\n};\n$('drawCar').onclick=drawCar;\n$('again').onclick=()=>{end.classList.add('hide');begin(TI)};\n$('next').onclick=()=>{end.classList.add('hide');begin(Math.min(TI+1,TR.length-1))};\n$('toMenu').onclick=()=>{end.classList.add('hide');hud.classList.add('hide');resetRace();for(const c of cars)pose(c);state='menu';menu.classList.remove('hide')};\naddEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});\n\n/* ================= LOOP ================= */\nloadTrack(0);resetRace();for(const c of cars)pose(c);state='menu';\ncamera.position.set(pl.x-8,2.4,pl.z);\nsync(0);\nlet last=performance.now();\nfunction frame(now){\n  requestAnimationFrame(frame);\n  const dt=Math.min(.05,(now-last)/1000);last=now;\n  if(state==='menu')time+=dt;\n  else if(!paused)step(dt);\n  audioStep();\n  updateCamera(dt);\n  sync(paused?0:dt);\n  sky.position.copy(camera.position);cloudG.position.copy(camera.position);\n  sun.target.position.set(pl.x,0,pl.z);sun.position.set(pl.x+SUNV.x*250,SUNV.y*250,pl.z+SUNV.z*250);\n  const K=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360));\n  if(!paused){smoke.update(dt,K);sparks.update(dt,K)}\n  renderer.render(scene,camera);\n  $('pause').style.display=(paused&&state!=='menu')?'flex':'none';\n  if(state!=='menu')hudUpdate(dt);\n}\nrequestAnimationFrame(frame);\n$('load').style.display='none';\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"}</script>
<script>
(function(){
  var META=[{"id": "ability", "name": "ABILITY ARENA", "tag": "First-person arena survival", "desc": "Fireballs, lightning and phantom dashes. Survive every round.", "keys": "WASD move · Mouse aim and fire · Q fireball · E dash · Space jump"}, {"id": "bots", "name": "BATTLE BOTS", "tag": "Build · Compete · Dominate", "desc": "Customize your bot in the garage, buy upgrades, then fight in the arena.", "keys": "WASD or Arrows move · Mouse aim · Hold click to fire"}, {"id": "blitz", "name": "BLITZ BOWL", "tag": "Arcade flag football", "desc": "5-on-5 football action. Juke, sprint and throw to the open receiver.", "keys": "WASD move · 1/2/3 throw · Space best open · Shift sprint"}, {"id": "dodge", "name": "DODGEBALL DUEL", "tag": "Retro pixel sports", "desc": "Red vs Blue. Play the CPU, a friend on one device, or online.", "keys": "Best with a keyboard · First to 3 rounds wins"}, {"id": "turbo", "name": "TURBO GP 3D", "tag": "3D racing", "desc": "Pick a track, drift, boost, earn coins and unlock new cars.", "keys": "W/Up gas · S/Down brake · A D steer · Space boost · Shift drift"}];
  var GAMES=JSON.parse(document.getElementById('gamedata').textContent);
  var grid=document.getElementById('grid'),stage=document.getElementById('stage'),host=document.getElementById('host'),
      pbtn=document.getElementById('pbtn'),bResume=document.getElementById('bResume'),
      bRestart=document.getElementById('bRestart'),bMenu=document.getElementById('bMenu');
  var cur=null,frame=null,paused=false;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  META.forEach(function(m){
    var b=document.createElement('button');
    b.className='card c-'+m.id;b.type='button';
    b.innerHTML='<span class="tag">'+esc(m.tag)+'</span><span class="nm">'+esc(m.name)+'</span><span class="ds">'+esc(m.desc)+'</span><span class="ky">'+esc(m.keys)+'</span><span class="go">▶ PLAY</span>';
    b.addEventListener('click',function(){start(m)});
    grid.appendChild(b);
  });
  function send(on){try{frame&&frame.contentWindow&&frame.contentWindow.postMessage({hub:'pause',on:on},'*')}catch(e){}}
  function mount(){
    if(frame){frame.remove();frame=null}
    var f=document.createElement('iframe');
    f.title=cur.name;f.setAttribute('allow','fullscreen; autoplay; gamepad');f.allowFullscreen=true;
    f.addEventListener('load',function(){ if(paused)send(true); else{try{f.contentWindow.focus()}catch(e){}} });
    host.appendChild(f);frame=f;f.srcdoc=GAMES[cur.id];
  }
  function setPaused(on){
    if(!cur||on===paused)return;
    paused=on;stage.classList.toggle('paused',on);send(on);
    if(on){bResume.focus()}else{try{frame.focus();frame.contentWindow.focus()}catch(e){}}
  }
  function start(m){
    cur=m;paused=false;
    stage.setAttribute('data-g',m.id);stage.classList.remove('paused');stage.classList.add('on');
    document.documentElement.style.overflow='hidden';
    document.title=m.name;
    var ac={ability:'#00eaff',bots:'#c92d2d',blitz:'#ffc857',dodge:'#ff5678',turbo:'#e8202a'}[m.id];
    stage.style.setProperty('--ac',ac);
    mount();
  }
  function quit(){
    try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
    if(frame){frame.remove();frame=null}
    cur=null;paused=false;
    stage.classList.remove('on','paused');
    document.documentElement.style.overflow='';
    document.title='Game Hub';
  }
  function restart(){paused=false;stage.classList.remove('paused');mount()}
  pbtn.addEventListener('click',function(){setPaused(true)});
  bResume.addEventListener('click',function(){setPaused(false)});
  bRestart.addEventListener('click',restart);
  bMenu.addEventListener('click',quit);
  window.addEventListener('message',function(e){
    if(frame&&e.source===frame.contentWindow&&e.data&&e.data.hub==='esc')setPaused(!paused);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&cur&&paused){e.preventDefault();setPaused(false)}
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&cur)setPaused(true)});
})();
</script>
