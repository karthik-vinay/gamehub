<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0c12;color:#f2f4fa;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% -20%,#1d2438 0,#0d1018 55%,#07080c 100%) fixed;overflow-x:hidden}
#hub{min-height:100%;padding:max(30px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
h1{margin:20px 0 6px;font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:.14em;text-align:center}
.lead{color:#8e97b0;font-size:15px;margin-bottom:34px;text-align:center}
.grid{width:min(1100px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:12px;text-align:left;padding:26px 24px;min-height:240px;cursor:pointer;color:#fff;border:0;position:relative;transition:transform .14s,box-shadow .14s,filter .14s;font:inherit}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none}
.card span{display:block}
.card .go{margin-top:auto;align-self:flex-start}
.card .ky{padding-top:10px}
/* Ability Arena: sci-fi */
.c-ability{font-family:Orbitron,sans-serif;background:linear-gradient(135deg,rgba(5,17,42,.98),rgba(4,8,22,.98));border:1px solid rgba(0,234,255,.45);box-shadow:0 0 40px rgba(0,170,255,.12),inset 0 0 40px rgba(0,90,255,.05)}
.c-ability:before,.c-ability:after{content:"";position:absolute;width:64px;height:4px;background:#00eaff;box-shadow:0 0 14px #00eaff}
.c-ability:before{top:-2px;left:18px}.c-ability:after{bottom:-2px;right:18px}
.c-ability:hover,.c-ability:focus-visible{box-shadow:0 0 50px rgba(0,200,255,.3),inset 0 0 40px rgba(0,90,255,.08)}
.c-ability .tag{color:#00eaff;letter-spacing:.25em;font-size:10px;text-transform:uppercase}
.c-ability .nm{font-weight:900;font-size:24px;letter-spacing:.06em}
.c-ability .ds{color:#c9d8ee;font-size:12px;line-height:1.7}
.c-ability .ky{color:#8299b9;font-size:9px;line-height:1.8;border-top:1px solid rgba(0,234,255,.2)}
.c-ability .go{border:1px solid #00eaff;color:#00eaff;padding:10px 18px;font-size:11px;letter-spacing:.22em;font-weight:700;transition:.15s}
.c-ability:hover .go{background:#00eaff;color:#021}
/* Battle Bots: gritty steel */
.c-bots{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 0,#252d39,#0b0d12 75%);border:2px solid #394554}
.c-bots:hover,.c-bots:focus-visible{border-color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.c-bots .tag{color:#929dac;letter-spacing:3px;font-size:12px;text-transform:uppercase}
.c-bots .nm{font-weight:900;font-style:italic;font-size:28px;letter-spacing:5px;text-shadow:4px 4px 0 #20252e}
.c-bots .ds{color:#c3cad4;font-size:14px;line-height:1.45}
.c-bots .ky{color:#7f8a99;font-size:11px;border-top:1px solid #2b3440}
.c-bots .go{background:#c92d2d;border:2px solid #ff5c5c;padding:10px 26px;font-weight:900;letter-spacing:1.5px;font-size:13px}
.c-bots:hover .go{background:#e63b3b}
/* Blitz Bowl: retro arcade */
.c-blitz{font-family:"Press Start 2P","Courier New",monospace;background:#1a1f3a;border:4px solid #3b4276;border-radius:14px;box-shadow:0 0 0 5px #070918,0 0 34px #ff4fa344}
.c-blitz:hover,.c-blitz:focus-visible{box-shadow:0 0 0 5px #070918,0 0 46px #ff4fa3aa,0 0 80px #4de2ff44}
.c-blitz .tag{color:#4de2ff;font-size:8px;letter-spacing:1px;line-height:1.6}
.c-blitz .nm{color:#ffc857;font-size:15px;line-height:1.4;text-shadow:3px 3px #8a2f5f}
.c-blitz .ds{color:#f7edc9;font-size:9px;line-height:1.9}
.c-blitz .ky{color:#b9e66b;font-size:7px;line-height:2;border-top:2px dashed #3b4276}
.c-blitz .go{background:#ffc857;color:#0b0e1c;padding:10px 12px;font-size:9px;box-shadow:0 4px 0 #8a6b1f}
/* Dodgeball Duel: retro pixel */
.c-dodge{font-family:'Courier New',monospace;font-weight:700;background:#282d54;border:4px solid #15162b;box-shadow:0 7px 0 #0b0c1b,inset 0 0 0 2px #57a8ff55}
.c-dodge:hover,.c-dodge:focus-visible{box-shadow:0 11px 0 #0b0c1b,inset 0 0 0 2px #57a8ff}
.c-dodge .tag{color:#56e6d0;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.c-dodge .nm{color:#fff1b8;font-size:26px;letter-spacing:2px;text-shadow:3px 3px 0 #ff5678}
.c-dodge .ds{color:#fff1b8;font-size:14px;line-height:1.5;font-weight:400}
.c-dodge .ky{color:#aeb4d4;font-size:12px;font-weight:400;border-top:2px dashed #424a7d}
.c-dodge .go{background:#ffd84e;color:#15162b;padding:11px 18px;font-size:13px;text-transform:uppercase;font-weight:900;box-shadow:0 5px 0 #a96a31;border-radius:2px}
/* Turbo GP: modern racing */
.c-turbo{font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(115deg,#0a0d14 55%,#1c0b10);border:1px solid #232a3a;border-left:7px solid #e8202a}
.c-turbo:hover,.c-turbo:focus-visible{border-color:#e8202a;box-shadow:0 10px 34px rgba(232,32,42,.28)}
.c-turbo .tag{color:#9aa6c0;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.c-turbo .nm{font-style:italic;font-weight:800;font-size:30px;letter-spacing:1px}
.c-turbo .ds{color:#d5dbea;font-size:14px;line-height:1.45}
.c-turbo .ky{color:#8793af;font-size:11px;font-weight:600;border-top:1px solid #2a3142}
.c-turbo .go{background:#e8202a;padding:10px 30px 10px 26px;font-style:italic;font-weight:800;letter-spacing:1px;font-size:13px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}

/* Playing */
#stage{position:fixed;inset:0;z-index:50;background:#000;display:none;--ac:#fff}
#stage.on{display:block}
#host{position:absolute;inset:0}
#host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#pbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:60;width:34px;height:60px;border:0;border-radius:10px 0 0 10px;background:rgba(10,12,24,.78);border-left:3px solid var(--ac);color:#fff;cursor:pointer;opacity:.4;transition:opacity .15s,width .15s;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
#pbtn:before{content:"";width:12px;height:16px;border-left:4px solid currentColor;border-right:4px solid currentColor}
#pbtn:hover,#pbtn:focus-visible{opacity:1;width:42px;outline:none}
@media (hover:none){#pbtn{opacity:.6}}
#stage.paused #pbtn{display:none}
#pause{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(2,3,10,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
#stage.paused #pause{display:flex}
.pp{width:min(340px,100%);padding:28px 24px;display:flex;flex-direction:column;gap:12px;text-align:center}
.pp h2{margin:0 0 10px;font-size:24px}
.pb{font:inherit;cursor:pointer;color:inherit;border:0;padding:13px 14px;font-size:14px}
.pb:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* themes */
[data-g=ability] .pp{font-family:Orbitron,sans-serif;background:linear-gradient(135deg,rgba(5,17,42,.97),rgba(4,8,22,.95));border:1px solid rgba(0,234,255,.5);box-shadow:0 0 60px rgba(0,170,255,.18)}
[data-g=ability] h2{color:#00eaff;letter-spacing:.2em;font-weight:900;font-size:20px}
[data-g=ability] .pb{background:transparent;border:1px solid rgba(0,234,255,.55);color:#00eaff;letter-spacing:.2em;font-size:11px;font-weight:700}
[data-g=ability] .pb:hover{background:rgba(0,234,255,.15)}
[data-g=ability] .pb.main{background:#00eaff;color:#021}
[data-g=bots] .pp{font-family:Arial,Helvetica,sans-serif;background:#12161d;border:2px solid #394554;box-shadow:0 20px 60px #000}
[data-g=bots] h2{font-style:italic;font-weight:900;letter-spacing:6px;font-size:30px;text-shadow:4px 4px 0 #20252e}
[data-g=bots] .pb{background:#1b222c;border:2px solid #394554;font-weight:900;letter-spacing:1.5px}
[data-g=bots] .pb:hover{background:#303b49;border-color:#fff}
[data-g=bots] .pb.main{background:#c92d2d;border-color:#ff5c5c}
[data-g=blitz] .pp{font-family:"Press Start 2P","Courier New",monospace;background:#1a1f3a;border:4px solid #3b4276;border-radius:14px;box-shadow:0 0 0 5px #070918,0 0 40px #ff4fa366}
[data-g=blitz] h2{color:#ffc857;font-size:18px;text-shadow:3px 3px #8a2f5f;animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
[data-g=blitz] .pb{background:#4de2ff;color:#0b0e1c;font-size:10px;padding:13px;box-shadow:0 4px 0 #1b7f95}
[data-g=blitz] .pb.main{background:#ffc857;box-shadow:0 4px 0 #8a6b1f}
[data-g=blitz] .pb.quit{background:#ff4fa3;box-shadow:0 4px 0 #8a2f5f}
[data-g=blitz] .pb:active{transform:translateY(3px);box-shadow:none}
[data-g=dodge] .pp{font-family:'Courier New',monospace;font-weight:700;background:#282d54;border:4px solid #15162b;box-shadow:0 8px 0 #0b0c1b}
[data-g=dodge] h2{color:#fff1b8;letter-spacing:3px;text-shadow:3px 3px 0 #ff5678}
[data-g=dodge] .pb{background:#56e6d0;color:#15162b;font-weight:900;text-transform:uppercase;box-shadow:0 5px 0 #228c89;border-radius:2px}
[data-g=dodge] .pb.main{background:#ffd84e;box-shadow:0 5px 0 #a96a31}
[data-g=dodge] .pb.quit{background:#ff5678;color:#fff;box-shadow:0 5px 0 #9e2e58}
[data-g=dodge] .pb:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
[data-g=turbo] .pp{font-family:"Trebuchet MS",Arial,sans-serif;background:rgba(8,10,16,.94);border-left:7px solid #e8202a;box-shadow:0 20px 60px rgba(0,0,0,.7)}
[data-g=turbo] h2{font-style:italic;font-weight:800;letter-spacing:3px;font-size:32px}
[data-g=turbo] .pb{background:#171c28;font-weight:800;font-style:italic;letter-spacing:1px;border-left:5px solid #e8202a}
[data-g=turbo] .pb:hover{background:#252c3e}
[data-g=turbo] .pb.main{background:#e8202a}
</style>
</head>
<body>

  <div class="lead">Choose a game to play</div>
  <div class="grid" id="grid"></div>
</div>
<div id="stage">
  <div id="host"></div>
  <button id="pbtn" type="button" title="Pause" aria-label="Pause"></button>
  <div id="pause" role="dialog" aria-label="Paused">
    <div class="pp">
      <h2>PAUSED</h2>
      <button class="pb main" id="bResume" type="button">RESUME</button>
      <button class="pb" id="bRestart" type="button">RESTART</button>
      <button class="pb quit" id="bMenu" type="button">QUIT TO MENU</button>
    </div>
  </div>
</div>

ackground:rgba(7,22,49,.72);color:#9db6d7;font-size:10px;line-height:1.8}\n.control b{color:white;font-size:12px}\n#loadStatus{margin-top:13px;color:#91a9c7;font-size:10px;min-height:15px;overflow-wrap:anywhere}\n#hud{display:none;position:fixed;inset:0;pointer-events:none}\n.hud-top{position:absolute;top:22px;left:25px;right:25px;display:flex;justify-content:space-between;align-items:flex-start}\n.hud-panel{padding:12px 17px;min-width:130px;background:rgba(2,9,24,.75);border-left:2px solid #00eaff;text-shadow:0 0 10px rgba(0,234,255,.3)}\n.hud-label{font-size:9px;letter-spacing:.18em;color:#8ca9cb}\n.hud-value{font-size:23px;font-weight:800;margin-top:5px}\n#healthWrap{position:absolute;left:25px;bottom:30px;width:230px}\n#healthBar{height:8px;background:rgba(255,255,255,.14);margin-top:8px}\n#healthFill{height:100%;width:100%;background:linear-gradient(90deg,#00b7ff,#00ffdc);transition:width .15s}\n#abilityHud{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:10px}\n.ability{min-width:100px;padding:11px 14px;border:1px solid rgba(0,234,255,.45);background:rgba(3,13,33,.85);text-align:center}\n.ability strong{display:block;color:#00eaff;font-size:19px}\n.ability span{color:#a4b9d8;font-size:9px;letter-spacing:.1em}\n#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px}\n#crosshair:before,#crosshair:after{content:\"\";position:absolute;background:rgba(225,250,255,.95);box-shadow:0 0 5px #00eaff}\n#crosshair:before{left:11px;top:2px;width:2px;height:20px}\n#crosshair:after{left:2px;top:11px;height:2px;width:20px}\n#vignette{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse,transparent 35%,rgba(255,0,30,.8) 100%);transition:opacity .2s}\n#countdown{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;background:rgba(0,5,17,.45);font-size:100px;font-weight:900;color:white;text-shadow:0 0 35px #00eaff;pointer-events:none}\n#gameOver{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;background:rgba(1,4,15,.92);text-align:center}\n.gameover-card{border:1px solid #ff3158;padding:45px;background:rgba(4,14,35,.91);box-shadow:0 0 55px rgba(255,35,80,.16)}\n.gameover-card h2{color:#ff3158;font-size:clamp(36px,7vw,64px);margin:0 0 12px}\n.gameover-card p{color:#a8b9d3;font-size:12px;margin-bottom:28px}\n#message{position:absolute;top:24%;left:50%;transform:translateX(-50%);color:#00eaff;font-size:13px;letter-spacing:.12em;text-shadow:0 0 12px #00eaff;text-align:center;white-space:nowrap}\n#help{position:absolute;right:25px;bottom:32px;text-align:right;color:#8299b9;font-size:9px;line-height:1.8}\n\n/* Touchscreen overlay */\n#touchControls{display:none;position:fixed;inset:0;z-index:8;pointer-events:none;user-select:none;-webkit-user-select:none}\n#lookArea{position:absolute;left:42%;right:0;top:15%;bottom:28%;pointer-events:auto;touch-action:none}\n#joystickBase{position:absolute;left:24px;bottom:32px;width:124px;height:124px;border:2px solid rgba(0,234,255,.48);border-radius:50%;background:rgba(3,18,43,.48);pointer-events:auto;touch-action:none}\n#joystickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%);border:2px solid rgba(0,234,255,.85);border-radius:50%;background:rgba(0,174,255,.35);box-shadow:0 0 18px rgba(0,234,255,.2)}\n#touchButtons{position:absolute;right:15px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;gap:9px;pointer-events:auto}\n.touch-row{display:flex;gap:8px;align-items:center}\n.touch-btn{min-width:62px;min-height:52px;padding:9px 11px;border:1px solid rgba(0,234,255,.72);border-radius:12px;color:white;background:rgba(4,17,40,.78);box-shadow:0 0 12px rgba(0,180,255,.12);font-size:10px;font-weight:800;letter-spacing:.04em;backdrop-filter:blur(5px)}\n.touch-btn:active,.touch-btn.active{background:rgba(0,174,255,.6);border-color:white}\n#touchFire{width:84px;height:84px;border-radius:50%;border:2px solid #00eaff;background:rgba(0,135,200,.48);font-size:12px;box-shadow:0 0 20px rgba(0,234,255,.25)}\n#touchJump{border-color:rgba(255,255,255,.55)}\n#touchSlide.active{background:rgba(0,174,255,.6)}\n#touchHint{position:absolute;right:18px;top:90px;color:rgba(202,231,255,.55);font-size:8px;letter-spacing:.1em;text-align:right}\n@media (pointer:coarse), (max-width:800px){\n  #touchControls{display:block}\n  #help{display:none}\n  #healthWrap{left:15px;bottom:170px;width:150px}\n  #abilityHud{display:none}\n  .hud-top{top:10px;left:10px;right:10px}\n  .hud-panel{min-width:0;padding:8px 10px}\n  .hud-label{font-size:7px;letter-spacing:.08em}\n  .hud-value{font-size:18px}\n  #message{top:20%;font-size:10px}\n}\n@media(max-width:480px){\n  .menu-card{padding:24px}\n  .controls{grid-template-columns:repeat(2,1fr)}\n  #joystickBase{left:15px;bottom:22px;width:112px;height:112px}\n  #joystickKnob{width:48px;height:48px}\n  #touchButtons{right:10px;bottom:14px;gap:7px}\n  .touch-btn{min-width:55px;min-height:46px;padding:7px;font-size:9px}\n  #touchFire{width:72px;height:72px}\n  #healthWrap{bottom:155px}\n  .gameover-card{padding:25px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"game\">\u003c/div>\n\n\u003cdiv id=\"menu\">\n  \u003cdiv class=\"menu-card\">\n    \u003cdiv class=\"kicker\">COMBAT SIMULATION // 01\u003c/div>\n    \u003ch1>ABILITY\u003cbr>\u003cspan>ARENA\u003c/span>\u003c/h1>\n    \u003cdiv class=\"subtitle\">ENTER THE ARENA. MASTER YOUR ABILITIES.\u003cbr>SURVIVE EVERY ROUND.\u003c/div>\n    \u003cdiv class=\"menu-line\">\u003c/div>\n    \u003cbutton id=\"startButton\" disabled>LOADING ARENA...\u003c/button>\n    \u003cdiv id=\"loadStatus\">Connecting to the 3D engine...\u003c/div>\n    \u003cdiv class=\"controls\">\n      \u003cdiv class=\"control\">\u003cb>W A S D / JOYSTICK\u003c/b>\u003cbr>MOVE\u003c/div>\n      \u003cdiv class=\"control\">\u003cb>MOUSE / DRAG\u003c/b>\u003cbr>AIM / LOOK\u003c/div>\n      \u003cdiv class=\"control\">\u003cb>HOLD CLICK / FIRE\u003c/b>\u003cbr>CONTINUOUS FIRE\u003c/div>\n      \u003cdiv class=\"control\">\u003cb>Q / FIREBALL\u003c/b>\u003cbr>FIREBALL\u003c/div>\n      \u003cdiv class=\"control\">\u003cb>E / DASH\u003c/b>\u003cbr>PHANTOM DASH\u003c/div>\n      \u003cdiv class=\"control\">\u003cb>SPACE / JUMP\u003c/b>\u003cbr>JUMP\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"hud\">\n  \u003cdiv class=\"hud-top\">\n    \u003cdiv class=\"hud-panel\">\u003cdiv class=\"hud-label\">PLAYER INTEGRITY\u003c/div>\u003cdiv class=\"hud-value\" id=\"healthText\">100\u003c/div>\u003c/div>\n    \u003cdiv class=\"hud-panel\" style=\"text-align:right\">\u003cdiv class=\"hud-label\">ROUND\u003c/div>\u003cdiv class=\"hud-value\" id=\"roundText\">01\u003c/div>\u003c/div>\n    \u003cdiv class=\"hud-panel\" style=\"text-align:right\">\u003cdiv class=\"hud-label\">HOSTILES REMAINING\u003c/div>\u003cdiv class=\"hud-value\" id=\"enemyText\">06\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"crosshair\">\u003c/div>\u003cdiv id=\"message\">\u003c/div>\n  \u003cdiv id=\"healthWrap\">\u003cdiv class=\"hud-label\">HEALTH\u003c/div>\u003cdiv id=\"healthBar\">\u003cdiv id=\"healthFill\">\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv id=\"abilityHud\">\n    \u003cdiv class=\"ability\">\u003cstrong>Q\u003c/strong>\u003cspan>FIREBALL\u003c/span>\u003c/div>\n    \u003cdiv class=\"ability\">\u003cstrong>✦\u003c/strong>\u003cspan>LIGHTNING\u003c/span>\u003c/div>\n    \u003cdiv class=\"ability\">\u003cstrong>E\u003c/strong>\u003cspan>PHANTOM DASH\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"help\">SHIFT — SPRINT\u003cbr>CTRL — SLIDE / CROUCH\u003cbr>SPACE — JUMP\u003cbr>ESC — RELEASE MOUSE\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"touchControls\">\n  \u003cdiv id=\"lookArea\" aria-label=\"Drag here to aim\">\u003c/div>\n  \u003cdiv id=\"touchHint\">DRAG TO AIM\u003c/div>\n  \u003cdiv id=\"joystickBase\">\u003cdiv id=\"joystickKnob\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"touchButtons\">\n    \u003cbutton id=\"touchFire\" class=\"touch-btn\">FIRE\u003c/button>\n    \u003cdiv class=\"touch-row\">\n      \u003cbutton id=\"touchQ\" class=\"touch-btn\">Q\u003cbr>FIREBALL\u003c/button>\n      \u003cbutton id=\"touchE\" class=\"touch-btn\">E\u003cbr>DASH\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"touch-row\">\n      \u003cbutton id=\"touchJump\" class=\"touch-btn\">JUMP\u003c/button>\n      \u003cbutton id=\"touchSlide\" class=\"touch-btn\">SLIDE\u003c/button>\n      \u003cbutton id=\"touchSprint\" class=\"touch-btn\">RUN\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"vignette\">\u003c/div>\n\u003cdiv id=\"countdown\">3\u003c/div>\n\u003cdiv id=\"gameOver\">\n  \u003cdiv class=\"gameover-card\">\n    \u003cdiv class=\"kicker\">SIMULATION TERMINATED\u003c/div>\n    \u003ch2>GAME OVER\u003c/h2>\n    \u003cp id=\"finalStats\">You were eliminated.\u003c/p>\n    \u003cbutton id=\"againButton\">PLAY AGAIN\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript type=\"module\">\nimport * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';\n\nconst $ = id => document.getElementById(id);\nlet renderer, scene, camera, clock, player, weapon, leftArm, rightArm;\nlet initialized=false, gameState='menu';\nlet enemies=[],projectiles=[],effects=[],obstacles=[];\nlet keys={},yaw=0,pitch=0,health=100,round=1,kills=0;\nlet fireCooldown=0,lightningCooldown=0,dashCooldown=0;\nlet jumpVelocity=0,grounded=true,dashTime=0,dashDirection=new THREE.Vector3();\nlet walkTime=0,timeSinceDamage=0,messageTimer=0,gameOverTimer=null;\nlet mouseHeld=false, touchFireHeld=false, touchMoveX=0, touchMoveY=0;\nlet touchSprint=false,touchSlide=false,joystickPointer=null,lookPointer=null;\nlet lookLastX=0,lookLastY=0,joystickKnob=null;\nconst mats={};\nconst raycaster=new THREE.Raycaster();\nconst up=new THREE.Vector3(0,1,0);\n\nfunction mat(color,emissive=0x000000,metalness=.25,roughness=.45){\n  return new THREE.MeshStandardMaterial({color,emissive,metalness,roughness});\n}\nfunction box(parent,material,x,y,z,sx,sy,sz,cast=true){\n  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);\n  m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m;\n}\nfunction showMessage(text,seconds=1.2){\n  $('message').textContent=text;messageTimer=seconds;\n}\nfunction initialize(){\n  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));\n  renderer.setSize(innerWidth,innerHeight);\n  renderer.shadowMap.enabled=true;\n  renderer.shadowMap.type=THREE.PCFSoftShadowMap;\n  renderer.outputColorSpace=THREE.SRGBColorSpace;\n  renderer.toneMapping=THREE.ACESFilmicToneMapping;\n  renderer.toneMappingExposure=1.15;\n  $('game').appendChild(renderer.domElement);\n\n  scene=new THREE.Scene();\n  scene.background=new THREE.Color(0x030918);\n  scene.fog=new THREE.FogExp2(0x030918,.008);\n  camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.1,250);\n  camera.rotation.order='YXZ';clock=new THREE.Clock();\n\n  mats.floor=mat(0x0b1830,0x020714,.4,.8);\n  mats.wall=mat(0x101f38,0x020918,.55,.5);\n  mats.cover=mat(0x182b47,0x020c1c,.55,.38);\n  mats.dark=mat(0x070e1d,0x01030a,.25,.7);\n  mats.cyan=mat(0x00cfff,0x007caa,.45,.25);\n  mats.blue=mat(0x1659ff,0x061b88,.4,.3);\n  mats.red=mat(0xff365b,0x6a071d,.2,.4);\n  mats.white=mat(0xc9efff,0x244e70,.2,.35);\n  mats.orange=mat(0xff7438,0x9b2d09,.3,.3);\n\n  buildArena();buildPlayer();addLights();\n  addEventListener('resize',resize);\n  document.addEventListener('mousemove',onMouseMove);\n  document.addEventListener('mousedown',onMouseDown);\n  document.addEventListener('mouseup',onMouseUp);\n  document.addEventListener('keydown',onKeyDown);\n  document.addEventListener('keyup',e=>keys[e.code]=false);\n  window.addEventListener('blur',releaseAllControls);\n  document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAllControls()});\n  setupTouchControls();\n\n  initialized=true;\n  $('startButton').disabled=false;\n  $('startButton').textContent='START MATCH';\n  $('loadStatus').textContent='Arena ready. Select START MATCH.';\n  animate();\n}\nfunction addLights(){\n  scene.add(new THREE.HemisphereLight(0x9dcaff,0x101020,1.5));\n  const sun=new THREE.DirectionalLight(0x8abaff,2.1);\n  sun.position.set(15,28,10);sun.castShadow=true;\n  sun.shadow.mapSize.set(1024,1024);scene.add(sun);\n  const a=new THREE.PointLight(0x00aaff,35,45);a.position.set(-10,7,-8);scene.add(a);\n  const b=new THREE.PointLight(0xff315f,28,35);b.position.set(13,5,5);scene.add(b);\n}\nfunction addObstacle(x,z,sx,sy,sz){\n  const mesh=box(scene,mats.cover,x,sy/2,z,sx,sy,sz);\n  box(scene,mats.cyan,x,sy+.025,z,sx*.82,.055,.045,false);\n  obstacles.push({x,z,hx:sx/2,hz:sz/2,mesh});\n}\nfunction buildArena(){\n  const floor=new THREE.Mesh(new THREE.PlaneGeometry(110,110),mats.floor);\n  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);\n  const grid=new THREE.GridHelper(110,55,0x0876b5,0x12345b);\n  grid.position.y=.015;scene.add(grid);\n  box(scene,mats.wall,0,4,-42,88,8,2);box(scene,mats.wall,0,4,42,88,8);\n  box(scene,mats.wall,-43,4,0,2,8,84);box(scene,mats.wall,43,4,0,2,8,84);\n  const edge=new THREE.MeshBasicMaterial({color:0x007dff});\n  box(scene,edge,0,.06,-40.8,84,.08,.12,false);\n  box(scene,edge,0,.06,40.8,84,.08,.12,false);\n  box(scene,edge,-41.8,.06,0,.12,.08,80,false);\n  box(scene,edge,41.8,.06,0,.12,.08,80,false);\n\n  [\n    [-17,-16,7,3.2,3.2],[-7,-23,5,2.4,3],[9,-22,6,2.6,3],\n    [20,-14,8,2.8,3],[-25,-3,6,2.8,3],[-13,3,5,2.4,3],\n    [0,-5,7,3,3.3],[13,1,7,2.7,3],[25,5,6,2.5,3],\n    [-21,18,7,2.5,3],[-8,22,5,2.5,3],[12,20,7,2.7,3],[25,24,6,2.8,3]\n  ].forEach(d=>addObstacle(...d));\n\n  for(const [x,z] of [[-32,-30],[32,-30],[-32,30],[32,30]]){\n    box(scene,mats.dark,x,3.4,z,4,6.8,4);\n    box(scene,mats.cyan,x,3.5,z+2.04,2.4,.12,.08,false);\n    box(scene,mats.blue,x,6.95,z,4.15,.1,4.15,false);\n    obstacles.push({x,z,hx:2,hz:2,mesh:null});\n  }\n  const reactor=new THREE.Group();reactor.position.set(0,0,-14);scene.add(reactor);\n  box(reactor,mats.dark,0,1.6,0,5,3.2,5);\n  box(reactor,mats.cyan,0,3.25,0,4.6,.12,4.6,false);\n  const core=new THREE.Mesh(new THREE.OctahedronGeometry(1.25),mats.cyan);\n  core.position.y=4.7;reactor.add(core);\n  const glow=new THREE.PointLight(0x00d9ff,14,18);glow.position.y=4.6;reactor.add(glow);\n  obstacles.push({x:0,z:-14,hx:2.5,hz:2.5,mesh:reactor});\n}\nfunction buildPlayer(){\n  player={pos:new THREE.Vector3(0,1.7,32),radius:.48};\n  camera.position.copy(player.pos);\n  const gunDark=mat(0x101a2b,0x01050b,.75,.28);\n  const gunBlue=mat(0x1455ad,0x04295f,.65,.25);\n  const gunGlow=new THREE.MeshStandardMaterial({\n    color:0x00eaff,emissive:0x00aaff,emissiveIntensity:2.5,metalness:.3,roughness:.2\n  });\n  weapon=new THREE.Group();weapon.position.set(.34,-.31,-.68);camera.add(weapon);\n  box(weapon,gunDark,0,0,0,.18,.17,.55);\n  box(weapon,gunBlue,0,.04,-.15,.22,.12,.31);\n  box(weapon,gunDark,0,-.11,.12,.14,.25,.16);\n  box(weapon,gunDark,0,.005,-.36,.11,.1,.32);\n  box(weapon,gunGlow,.096,.035,-.17,.012,.055,.21);\n  box(weapon,gunGlow,0,.103,-.18,.075,.014,.17);\n  box(weapon,gunDark,0,.13,-.06,.12,.055,.17);\n  box(weapon,gunBlue,0,.16,-.06,.08,.025,.11);\n  const armMat=mat(0x243d5b,0x071020,.2,.65);\n  rightArm=new THREE.Group();rightArm.position.set(.22,-.24,-.24);camera.add(rightArm);\n  box(rightArm,armMat,0,-.13,-.03,.16,.38,.18);\n  box(rightArm,mats.dark,0,.035,-.1,.19,.15,.19);\n  leftArm=new THREE.Group();leftArm.position.set(-.25,-.28,-.24);camera.add(leftArm);\n  box(leftArm,armMat,0,-.12,-.02,.15,.34,.16);\n  box(leftArm,mats.dark,0,.025,-.11,.17,.13,.17);\n}\nfunction resize(){\n  if(!renderer)return;\n  camera.aspect=innerWidth/innerHeight;\n  camera.updateProjectionMatrix();renderer.set x.alive)){\n      showMessage('ROUND CLEARED',1.4);\n      setTimeout(()=>{if(gameState==='playing'){round++;spawnRound()}},1500);\n    }\n  }\n}\nfunction lineBlocked(from,to){\n  const dir=to.clone().sub(from),distance=dir.length();\n  if(distance\u003c.1)return false;\n  raycaster.set(from,dir.normalize());raycaster.far=distance;\n  const meshes=[];\n  for(const o of obstacles)if(o.mesh)meshes.push(o.mesh);\n  return raycaster.intersectObjects(meshes,true).length>0;\n}\nfunction hasClearShot(enemy){\n  const from=enemy.group.position.clone().add(new THREE.Vector3(0,1.65,0));\n  return !lineBlocked(from,player.pos.clone());\n}\nfunction findFlankDirection(enemy,toPlayer){\n  const p=enemy.group.position;\n  const side=new THREE.Vector3(-toPlayer.z,0,toPlayer.x);\n  const leftOk=!collidesAt(p.x-side.x*2,p.z-side.z*2,.65);\n  const rightOk=!collidesAt(p.x+side.x*2,p.z+side.z*2,.65);\n  if(leftOk&&!rightOk)return -1;\n  if(rightOk&&!leftOk)return 1;\n  return enemy.strafeDir;\n}\nfunction updateEnemies(dt){\n  for(const e of enemies){\n    if(!e.alive)continue;\n    const pos=e.group.position;\n    const toPlayer=new THREE.Vector3(player.pos.x-pos.x,0,player.pos.z-pos.z);\n    const distance=toPlayer.length();\n    if(distance>.001)toPlayer.normalize();\n    e.group.rotation.y=Math.atan2(toPlayer.x,toPlayer.z);\n    const visible=distance\u003c34&&hasClearShot(e);\n    e.strafeTimer-=dt;\n    if(e.strafeTimer\u003c=0){e.strafeTimer=.8+Math.random()*1.6;e.strafeDir=Math.random()\u003c.5?-1:1}\n\n    const moving=new THREE.Vector3();\n    if(distance>8){\n      moving.add(toPlayer);\n      if(!visible)moving.addScaledVector(new THREE.Vector3(-toPlayer.z,0,toPlayer.x),e.strafeDir*.65);\n    }else if(distance\u003c5){\n      moving.addScaledVector(toPlayer,-.7);\n      moving.addScaledVector(new THREE.Vector3(-toPlayer.z,0,toPlayer.x),e.strafeDir*.7);\n    }else{\n      moving.addScaledVector(new THREE.Vector3(-toPlayer.z,0,toPlayer.x),e.strafeDir*.85);\n    }\n    if(mo om:6px}.panel>p{color:#8994a3}\n.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}\n.credits{color:#ffd34e;font-weight:1000}\n.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}\n.card{background:#151b23;border:1px solid #303b48;padding:18px;position:relative;min-width:0}\n.card:hover{border-color:#667383}.card h3{margin-bottom:8px;font-size:16px}.card p{color:#8994a3;font-size:13px;line-height:1.5}\n.card button{width:100%;margin:12px 0 0;padding:10px}\n.price{color:#ffd34e;font-weight:bold;margin-top:13px}\n.badge{position:absolute;top:10px;right:10px;font-size:9px;padding:5px 7px;background:#29333f;color:#9da9b7;font-weight:bold}\n.badge.active{color:#76e0ff;background:#16313d}\n.selected{border-color:#72d8ff;box-shadow:0 0 20px rgba(75,200,255,.12)}\n.bot-preview{height:118px;margin:-18px -18px 15px;background:radial-gradient(circle at 50% 45%,#26323f,#0b1017 72%);border-bottom:1px solid #35414f;display:flex;align-items:center;justify-content:center;overflow:hidden}.bot-preview canvas{width:100%;height:118px;display:block}.arena-preview{height:150px;margin:-18px -18px 15px;position:relative;overflow:hidden;background:#0b1017;border-bottom:1px solid #35414f;isolation:isolate}\n.arena-preview canvas{position:relative;inset:auto;display:block;width:100%;height:100%;cursor:pointer;z-index:0}\n.arena-preview:before{content:\"TACTICAL MAP  /  LIVE LAYOUT\";position:absolute;left:9px;top:8px;z-index:2;font:800 9px/1 Arial,sans-serif;letter-spacing:1.6px;color:rgba(240,248,255,.8);text-shadow:0 1px 5px #000;pointer-events:none}\n.arena-preview:after{content:\"\";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.06) 45%,transparent 65%);background-size:220% 100%;animation:mapGlint 5s linear infinite}\n.card.selected .arena-preview{box-shadow:inset 0 0 0 2px #72d8ff, inset 0 0 24px rgba(70,200,255,.16)}\n.card.selected .arena-preview:before{content:\"SELECTED  •  TACTICAL MAP\";color:#8ce8ff}\n@keyframes mapGlint{0%{background-position:120% 0}100%{background-position:-120% 0}}\n@media(max-width:800px){.arena-preview{height:clamp(130px,24vw,180px)}}\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}\n.statbox{background:#11161d;border:1px solid #29333f;padding:12px}.statbox span{display:block;color:#7f8b99;font-size:10px;letter-spacing:1px;margin-bottom:4px}.statbox strong{font-size:18px}\n#hud{position:fixed;inset:0;z-index:5;pointer-events:none}\n.hudtop{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}\n.hudbox{min-width:180px;padding:9px 12px;background:rgba(7,10,14,.86);border:1px solid #35414f}\n.healthlabel{color:#929dab;font-size:10px;letter-spacing:2px}.healthbar{width:min(22vw,230px);height:12px;background:#20262e;margin-top:6px;overflow:hidden}.healthfill{width:100%;height:100%;background:#39d36f}.enemyfill{background:#e34040}\n.roundHUD{text-align:center;padding:4px 8px;text-shadow:0 2px 8px #000}.roundHUD .small{font-size:10px;letter-spacing:3px;color:#c0c8d2}.roundHUD .round{font-size:24px;font-weight:1000;font-style:italic}.streak{color:#ffd34e;font-size:11px;margin-top:4px;text-shadow:0 0 12px rgba(255,211,78,.45)}\n#roundMessage{filter:drop-shadow(0 0 28px rgba(255,255,255,.14))}\n#roundTitle{background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);padding:8px 18px;border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22)}\n#countdown{color:#fff;text-shadow:0 0 18px #6ed3ff,0 0 45px rgba(110,211,255,.7)}\n.hudbox{box-shadow:0 6px 25px rgba(0,0,0,.25)}\n.healthfill{transition:width .12s linear}\n#comboPopup{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:clamp(16px,3vw,27px);font-weight:1000;letter-spacing:3px;color:#ffe17c;text-shadow:0 0 18px rgba(255,192,40,.8);animation:comboPop .65s ease-out forwards}\n@keyframes comboPop{0%{opacity:0;transform:translate(-50%,12px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px) scale(1.02)}}\n.center-message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:1000;font-style:italic;text-shadow:0 5px 25px #000;max-width:94vw}\n#countdown{font-size:clamp(80px,15vw,170px)}#roundMessage{font-size:clamp(34px,7vw,78px);white-space:normal}\n.taunt{margin-top:12px;color:#c0c8d2;font-size:clamp(13px,2vw,20px);letter-spacing:2px;font-style:normal}\n.controls{position:absolute;bottom:14px;left:15px;color:#a4adba;font-size:11px;text-shadow:0 2px 5px #000}\n#mobileControls{display:none;position:fixed;inset:0;z-index:10;pointer-events:none}\n.touch{pointer-events:auto;position:absolute;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(27,34,44,.78);border:2px solid rgba(255,255,255,.3);font-size:11px;font-weight:900;touch-action:none}\n#up{left:70px;bottom:125px}#down{left:70px;bottom:5px}#left{left:5px;bottom:65px}#right{left:135px;bottom:65px}\n#attack{right:15px;bottom:95px;background:rgba(180,35,35,.8)}#dash{right:95px;bottom:20px}#shield{right:15px;bottom:20px}\n@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hudbox{min-width:115px;padding:7px}.healthbar{width:clamp(75px,22vw,145px)}#mobileControls{display:block}.controls{display:none}.roundHUD{margin-top:58px}.stats{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:520px){.grid{grid-template-columns:1fr}.panel{padding:17px}.logo{letter-spacing:4px}.hudbox{min-width:100px}.healthbar{width:90px}.roundHUD .round{font-size:19px}.healthlabel{font-size:9px}.hudtop{left:5px;right:5px;top:5px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"game\">\u003c/canvas>\n\n\u003cdiv id=\"menu\" class=\"screen\">\n  \u003cdiv class=\"logo\">BATTLE BOTS\u003c/div>\u003cdiv class=\"subtitle\">BUILD • COMPETE • DOMINATE\u003c/div>\n  \u003cdiv class=\"menu-buttons\">\n    \u003cbutton class=\"primary\" id=\"startBtn\">ENTER ARENA\u003c/button>\n    \u003cbutton id=\"garageBtn\">GARAGE\u003c/button>\u003cbutton id=\"shopBtn\">SHOP\u003c/button>\n    \u003cbutton id=\"helpBtn\">HOW TO PLAY\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"subtitle\" style=\"margin-top:18px;letter-spacing:2px\">CREDITS: \u003cspan class=\"credits\" id=\"menuCredits\">250\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"arenaSelect\" class=\"screen hidden\">\u003cdiv class=\"panel\">\n  \u003cdiv class=\"topbar\">\u003cdiv>\u003ch2>ARENA SELECT\u003c/h2>\u003cp>Choose your battleground. Arenas are cosmetic/layout choices, not difficulty levels.\u003c/p>\u003c/div>\u003cdiv class=\"credits\">CR \u003cspan id=\"arenaCredits\">250\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"grid\" id=\"arenaGrid\">\u003c/div>\n  \u003cdiv style=\"text-align:center;margin-top:18px\">\u003cbutton class=\"primary\" id=\"confirmArena\">ENTER BATTLE\u003c/button>\u003cbutton data-screen=\"menu\">BACK\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cdiv id=\"garage\" class=\"screen hidden\">\u003cdiv class=\"panel\">\n  \u003cdiv class=\"topbar\">\u003cdiv>\u003ch2>GARAGE\u003c/h2>\u003cp>Your personal bot workshop. Equip only parts and cosmetics you already own. Some chassis and wheel choices also change your bot's stats; purchases happen only in the Shop.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"bot-preview\" style=\"height:220px;margin:18px 0 12px;border:1px solid #35414f\">\u003ccanvas id=\"garageBotPreview\" width=\"700\" height=\"220\" style=\"height:220px\">\u003c/canvas>\u003c/div>\n  \u003cp style=\"color:#9ba8b8;font-size:12px;text-align:center\">LIVE BOT PREVIEW • Changes appear here immediately. Equip owned parts here; buy items only in the Shop.\u003c/p>\n  \u003cdiv class=\"garage-loadout\" id=\"garageLoadout\" style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 26px\">\u003c/div>\n  \u003ch3 style=\"margin-top:25px\">CHASSIS STYLE\u003c/h3>\u003cdiv class=\"grid\" id=\"chassisGrid\">\u003c/div>\n  \u003ch3 style=\"margin-top:25px\">WHEELS\u003c/h3>\u003cdiv class=\"grid\" id=\"wheelGrid\">\u003c/div>\n  \u003ch3 style=\"margin-top:25px\">PAINT COLOR\u003c/h3>\u003cdiv class=\"grid\" id=\"paintGrid\">\u003c/div>\n  \u003ch3 style=\"margin-top:25px\">DECALS\u003c/h3>\u003cdiv class=\"grid\" id=\"decalGrid\">\u003c/div>\n  \u003cdiv style=\"text-align:center;margin-top:20px\">\u003cbutton data-screen=\"menu\">BACK\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cdiv id=\"shop\" class=\"screen hidden\">\u003cdiv class=\"panel\">\n  \u003cdiv class=\"topbar\">\u003cdiv>\u003ch2>BOT SHOP\u003c/h2>\u003cp>Buy upgrades and cosmetics here. Preview each item before spending credits.\u003c/p>\u003c/div>\u003cdiv class=\"credits\">CR \u003cspan id=\"shopCredits\">250\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv style=\"margin-top:15px;color:#8e9baa;font-size:12px\">UPGRADES • FUNCTIONAL PARTS • COSMETICS\u003c/div>\u003cp style=\"color:#9ba8b8;font-size:12px\">Motors, armor, weapons, chassis and wheels change gameplay. Paint and decals are visual only. Buy parts here, then equip owned chassis and wheels in the Garage.\u003c/p>\n  \u003cdiv class=\"grid\" id=\"shopGrid\">\u003c/div>\n  \u003cdiv style=\"text-align:center;margin-top:20px\">\u003cbutton data-screen=\"menu\">BACK\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cdiv id=\"help\" class=\"screen hidden\">\u003cdiv class=\"panel\">\n  \u003ch2>HOW TO PLAY\u003c/h2>\u003cdiv style=\"margin-top:20px;line-height:1.9;color:#c0c8d2\">\n  \u003cp>\u003cb>W A S D / ARROWS\u003c/b> — Move\u003c/p>\u003cp>\u003cb>MOUSE\u003c/b> — Aim\u003c/p>\u003cp>\u003cb>HOLD LEFT CLICK\u003c/b> — Fire energy bolts\u003c/p>\u003cp>\u003cb>SPACE\u003c/b> — Dash\u003c/p>\u003cp>\u003cb>Q\u003c/b> — Shield\u003c/p>\n  \u003cp>\u003cb>PHONE / IPAD\u003c/b> — On-screen movement, ATTACK, BOOST and SHIELD controls\u003c/p>\u003cbr>\n  \u003cp>Win each round to earn credits. Every new round starts with a 3-second countdown. Rivals get tougher, faster, smarter, and more colorful every round. Build a streak for bigger credit bonuses.\u003c/p>\u003cp>Select an arena before starting a match; it stays the same throughout that match.\u003c/p>\u003cp>Visit the separate Shop to buy upgrades and cosmetics, then equip cosmetics in the Garage.\u003c/p>\n  \u003c/div>\u003cbutton data-screen=\"menu\" style=\"margin-top:20px\">BACK\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003cdiv id=\"hud\" class=\"hidden\">\n  \u003cdiv class=\"hudtop\">\n    \u003cdiv class=\"hudbox\">\u003cdiv class=\"healthlabel\">YOUR ROBOT\u003c/div>\u003cdiv class=\"healthbar\">\u003cdiv class=\"healthfill\" id=\"playerHealth\">\u003c/div>\u003c/div>\u003cdiv style=\"font-size:11px;margin-top:5px\" id=\"playerHealthText\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"roundHUD\">\u003cdiv class=\"small\" id=\"arenaNameHUD\">ARENA\u003c/div>\u003cdiv class=\"round\" id=\"roundText\">ROUND 1\u003c/div>\u003cdiv class=\"streak\" id=\"streakText\">WIN STREAK: 0\u003c/div>\u003c/div>\n    \u003cdiv class=\"hudbox\" style=\"text-align:right\">\u003cdiv class=\"healthlabel\" id=\"enemyName\">RIVAL BOT\u003c/div>\u003cdiv class=\"healthbar\" style=\"margin-left:auto\">\u003cdiv class=\"healthfill enemyfill\" id=\"enemyHealth\">\u003c/div>\u003c/div>\u003cdiv style=\"font-size:11px;margin-top:5px\" id=\"enemyHealthText\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"countdown\" class=\"center-message hidden\">\u003c/div>\n  \u003cdiv id=\"roundMessage\" class=\"center-message hidden\">\u003cdiv id=\"roundTitle\">\u003c/div>\u003cdiv class=\"taunt\" id=\"taunt\">\u003c/div>\u003c/div>\u003cdiv id=\"comboPopup\" class=\"hidden\">\u003c/div>\n  \u003cdiv class=\"controls\">WASD / ARROWS MOVE • MOUSE AIM • HOLD CLICK FIRE • SPACE DASH • Q SHIELD • ESC MENU\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"mobileControls\" class=\"hidden\">\n  \u003cdiv class=\"touch\" id=\"up\">▲\u003c/div>\u003cdiv class=\"touch\" id=\"down\">▼\u003c/div>\u003cdiv class=\"touch\" id=\"left\">◀\u003c/div>\u003cdiv class=\"touch\" id=\"right\">▶\u003c/div>\n  \u003cdiv class=\"touch\" id=\"attack\">FIRE\u003c/div>\u003cdiv class=\"touch\" id=\"dash\">BOOST\u003c/div>\u003cdiv class=\"touch\" id=\"shield\">SHIELD\u003c/div>\n\u003c/div>\n\n\u003cscript>\n\"use strict\";\nconst canvas=document.getElementById(\"game\"),ctx=canvas.getContext(\"2d\");\nlet W=innerWidth,H=innerHeight;\nfunction resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;if(arenaReady){generateArena();if(typeof renderArenas===\"function\"&&!$(\"arenaSelect\").classList.contains(\"hidden\"))renderArenas();}}\n\nconst $=id=>document.getElementById(id);\nlet gameRunning=false,countdownRunning=false,round=1,wins=0,selectedArena=\"factory\",arenaReady=false,combo=0,bestCombo=0,screenShake=0,flashFX=0;\nlet credits=250,roundTimer=null,intermissionTimer=null,gameToken=0,lastTime=0;\naddEventListener(\"resize\",resize);resize();\nconst baseUpgrades={armor:1,motor:1,weapon:1,cooling:1,shield:1,battery:1};\nlet upgrades={...baseUpgrades};\nlet owned={chassis:[\"standard\"],wheels:[\"standard\"],paint:[\"steel\"],decal:[\"none\"]};\nlet equipped={chassis:\"standard\",wheels:\"standard\",paint:\"steel\",decal:\"none\"};\ntry{const s=JSON.parse(localStorage.getItem(\"battleBotsSave\"));if(s){credits=Number.isFinite(s.credits)?s.credits:credits;upgrades={...baseUpgrades,...(s.upgrades||{})};owned={...owned,...(s.owned||{})};equipped={...equipped,...(s.equipped||{})};}}catch(e){}\nfunction save(){try{localStorage.setItem(\"battleBotsSave\",JSON.stringify({credits,upgrades,owned,equipped}));}catch(e){}updateCreditLabels();}\n\nconst keys={};let mouse={x:W/2,y:H/2,down:false};\naddEventListener(\"keydown\",e=>{const k=e.key.toLowerCase();keys[k]=true;if([\"arrowup\",\"arrowdown\",\"arrowleft\",\"arrowright\",\" \"].includes(k))e.preventDefault();if(e.code===\"Space\")dashPlayer();if(k===\"q\")activateShield();if(k===\"escape\"&&gameRunning)endGame(false,true);});\naddEventListener(\"keyup\",e=>{keys[e.key.toLowerCase()]=false;});\ncanvas.addEventListener(\"pointermove\",e=>{if(e.pointerType===\"mouse\"){mouse.x=e.clientX;mouse.y=e.clientY;}});\ncanvas.addEventListener(\"pointerdown\",e=>{if(e.pointerType===\"mouse\"&&e.button===0)mouse.down=true;});\naddEventListener(\"pointerup\",e=>{if(e.pointerType===\"mouse\"&&e.button===0)mouse.down=false;});\nfunction touchKey(id,key){const el=$(id);el.addEventListener(\"pointerdown\",e=>{e.preventDefault();keys[key]=true;el.setPointerCapture?.(e.pointerId);});[\"pointerup\",\"pointercancel\",\"lostpointercapture\"].forEach(ev=>el.addEventListener(ev,e=>{keys[key]=false;}));}\ntouchKey(\"up\",\"w\");touchKey(\"down\",\"s\");touchKey(\"left\",\"a\");touchKey(\"right\",\"d\");\n$(\"attack\").addEventListener(\"pointerdown\",e=>{e.preventDefault();mouse.down=true;});\n[\"pointerup\",\"pointercancel\",\"lostpointercapture\"].forEach(ev=>$(\"attack\").addEventListener(ev,()=>mouse.down=false));\n$(\"dash\").addEventListener(\"pointerdown\",e=>{e.preventDefault();dashPlayer();});\n$(\"shield\").addEventListener(\"pointerdown\",e=>{e.preventDefault();activateShield();});\n\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);\nconst angleTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);\nconst random=(a,b)=>Math.random()*(b-a)+a;\n\nconst arenas={\n factory:{name:\"IRON FACTORY\",floor:\"#11161c\",grid:\"#71808f\",obstacle:\"#29313a\",accent:\"#6ed3ff\",description:\"Industrial platforms and a hot central core.\"},\n desert:{name:\"DUST BASIN\",floor:\"#211b14\",grid:\"#b99a6b\",obstacle:\"#4b3927\",accent:\"#ffbd62\",description:\"A sun-baked scrap yard under amber lights.\"},\n ice:{name:\"FROST FACILITY\",floor:\"#111d24\",grid:\"#78aab9\",obstacle:\"#29424d\",accent:\"#86eaff\",description:\"Cold steel, pale lights and slippery-looking floors.\"},\n neon:{name:\"NEON DISTRICT\",floor:\"#150f1b\",grid:\"#bb63dc\",obstacle:\"#352341\",accent:\"#e968ff\",description:\"Purple-lit urban combat platform.\"},\n orbital:{name:\"ORBITAL DECK\",floor:\"#0e1119\",grid:\"#64738e\",obstacle:\"#252d3c\",accent:\"#9daeff\",description:\"A high-tech station above the planet.\"},\n scrapyard:{name:\"SCRAP YARD\",floor:\"#181612\",grid:\"#8f805d\",obstacle:\"#3a3325\",accent:\"#f0b74e\",description:\"A cluttered mechanical arena.\"}\n};\nconst arena={margin:48,obstacles:[],hazards:[]};\nfunction generateArena(){\n arenaReady=true;\n // Each arena has its own gameplay layout. Coordinates are normalized so the\n // same geometry is used by the live arena and its tactical-map preview.\n const layouts={\n  factory:{\n   walls:[[.28,.28,.16,.055],[.56,.28,.16,.055],[.28,.665,.16,.055],[.56,.665,.16,.055],[.455,.39,.09,.06],[.455,.55,.09,.06]],\n   hazards:[[.5,.5,.038]]\n  },\n  desert:{\n   walls:[[.22,.22,.075,.15],[.38,.34,.13,.06],[.62,.22,.075,.15],[.70,.48,.09,.07],[.23,.62,.14,.065],[.43,.73,.08,.12],[.57,.30,.07,.09],[.54,.61,.13,.06]],\n   hazards:[[.5,.5,.032],[.34,.52,.018]]\n  },\n  ice:{\n   walls:[[.33,.20,.045,.22],[.33,.58,.045,.22],[.62,.20,.045,.22],[.62,.58,.045,.22],[.43,.36,.14,.04],[.43,.60,.14,.04]],\n   hazards:[[.5,.5,.026]]\n  },\n  neon:{\n   walls:[[.25,.25,.20,.045],[.55,.25,.20,.045],[.25,.70,.20,.045],[.55,.70,.20,.045],[.37,.36,.055,.19],[.58,.45,.055,.19],[.45,.46,.10,.045]],\n   hazards:[[.5,.5,.028],[.5,.32,.014],[.5,.68,.014]]\n  },\n  orbital:{\n   walls:[[.43,.20,.14,.045],[.43,.755,.14,.045],[.27,.34,.05,.13],[.68,.34,.05,.13],[.27,.53,.05,.13],[.68,.53,.05,.13],[.39,.40,.055,.055],[.555,.40,.055,.055],[.39,.545,.055,.055],[.555,.545,.055,.055]],\n   hazards:[[.5,.5,.033]]\n  },\n  scrapyard:{\n   walls:[[.20,.25,.12,.07],[.37,.20,.055,.14],[.62,.23,.13,.065],[.66,.31,.0 -- chiptune sfx\nlet AC=null;\nfunction tone(f,d=.1,type='square',v=.05,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}\nconst seq=(a,d=.1,ty='square',gap=.08)=>a.forEach((f,i)=>tone(f,d,ty,.05,0,i*gap));\nconst sfx={throw:()=>tone(300,.18,'square',.05,500),catch:()=>seq([660,990],.08,'square',.07),coin:()=>seq([988,1319],.08,'square',.06),down:()=>seq([523,659,784]),\ntd:()=>seq([523,659,784,1047,784,1047,1319],.12,'square',.09),hit:()=>tone(160,.28,'sawtooth',.08,-120),juke:()=>tone(900,.12,'triangle',.06,-600),\nover:()=>seq([392,330,262,196],.25,'square',.2),start:()=>seq([262,330,392,523],.1,'square',.07)};\n// ---- helpers\nconst mult=()=>1+Math.min(combo,4);\nfunction banner(s,sec=1.2,c='#ffe08a'){msg=s;msgT=sec;msgC=c}\nfunction pop(x,y,s,c='#fff0c6'){pops.push({x,y,s,c,l:1})}\nfunction addPts(n,x,y,label){const v=n*mult();score+=v;pop(x,y,'+'+v+(label?' '+label:''),label?'#ffe45c':'#fff0c6')}\nfunction burst(x,y,c,n=12,g=300){for(let i=0;i\u003cn;i++){const a=rnd(0,6.28),s=rnd(40,200);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:rnd(.4,.9),c,s:rnd(3,6),g})}}\nfunction hud(){\n  $('score').textContent=String(score).padStart(6,'0');$('hi').textContent=String(Math.max(hi,score)).padStart(6,'0');\n  $('level').textContent=level;$('lives').textContent='♥'.repeat(Math.max(0,lives))||'—';\n  const px=P?P.x:los;$('down').textContent=['1ST','2ND','3RD','4TH'][down-1]+' & '+Math.max(1,Math.ceil((fd-px)/YD));\n  $('time').textContent=Math.ceil(clock);\n}\nfunction newPlay(keepY){\n  const y=keepY&&P?P.y:F.y+F.h/2;\n  P={x:los,y,has:true,inv:0,st:1,jk:0,jcd:0,jd:{x:1,y:0},num:SEL.num,nm:nm(SEL.n)};\n  R=WR.map((w,i)=>({...ROUTES[SV.plan[i]],yb:w.yb,num:w.num,nm:w.n,ph:i*1.3,x:los+ROUTES[SV.plan[i]].ox,y:F.y+F.h*w.yb,gap:99,open:true}));R.forEach(r=>{r.x=clamp(los+r.ox+Math.sin(r.ph*r.fx)*r.ax,F.x+80,F.x+F.w-45);r.y=clamp(F.y+F.h*r.yb+Math.sin(r.ph*r.fy)*r.ay,F.y+25,F.y+F.h-25)});B={x:los-40,y};\n  const n=5,ypos=[.5,.28,.15,.62,.85];D=[];\n  for(let i=0;i\u003cn;i++){const dy=F.y+F.h*ypos[i];D.push({x:Math.min(los+270+(i%2)*60+(i>1?60:0),GOAL-30),y:dy,hy:dy,role:i,sp:(i\u003c2?68:74)+level*7,stun:0})}\n  ball=null;coins=[];for(let i=0;i\u003c6;i++)coins.push({x:rnd(los+120,GOAL-30),y:rnd(F.y+30,F.y+F.h-30)});\n  hud();\n}\nfunction titlePanelOld(){return `\u003cdiv class=\"pn\">\u003ch1>PIXEL\u003cbr>GRIDIRON\u003c/h1>\u003cp style=\"color:#8fc0ff\">YOUR TEAM: BLUE BOMBERS\u003cbr>QB #12 • WR #8 #81 #84 • OL #55\u003c/p>\u003cp style=\"color:#ffc857\">VS GOLD RUSH: 5 DEFENDERS\u003cbr>1 RUSHER • 1 SPY • 3 COVER MEN\u003c/p>\u003cp>PICK YOUR WR WITH 1 2 3 • TAP TO THROW\u003c/p>\u003cp class=\"hs\">HI-SCORE ${String(hi).padStart(6,'0')}\u003c/p>\u003cbutton class=\"btn\" data-start>PRESS START ▶\u003c/button>\u003cp style=\"color:#8e9ac8\">1 PLAYER • 3 LIVES • 90 SEC + BONUS TIME\u003c/p>\u003c/div>`}\n$('ov').innerHTML=titlePanel();\n$('ov').addEventListener('click',e=>{if(e.target.closest('[data-start]'))startGame()});\nfunction startGame(){score=0;tds=0;lives=3;level=1;clock=90;down=1;combo=0;paused=false;wait=0;after=null;los=F.x+90;fd=los+10*YD;parts=[];pops=[];state='playing';$('ov').style.display='none';newPlay();cd=3;cdn=4;msgT=0;sfx.start()}\nfunction endGameOld(){\n  state='over';const nh=score>hi;if(nh){hi=score;try{localStorage.setItem('pg_hi',hi)}catch(e){}}sfx.over();hud();\n  $('ov').style.display='flex';$('ov').innerHTML=`\u003cdiv class=\"pn\">\u003ch1>GAME\u003cbr>OVER\u003c/h1>\u003cp>FINAL SCORE\u003cbr>\u003cspan style=\"font-size:22px;color:#ffc857\">${String(score).padStart(6,'0')}\u003c/span>\u003c/p>\u003cp>REACHED
